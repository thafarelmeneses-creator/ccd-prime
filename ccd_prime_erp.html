<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCD Prime ERP — Casa do Curativo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#eee;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#9ca3af;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--green-bg:#eaf3de;--green-txt:#3b6d11;--red-bg:#fcebeb;--red-txt:#a32d2d;--warn-bg:#faeeda;--warn-txt:#854f0b;--info-bg:#e6f1fb;--info-txt:#185fa5;--blue:#378ADD;--r:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--green-bg:#173404;--green-txt:#97c459;--red-bg:#501313;--red-txt:#f09595;--warn-bg:#412402;--warn-txt:#fac775;--info-bg:#042c53;--info-txt:#85b7eb;}}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--border);background:var(--bg);flex-shrink:0;}
.brand{font-size:15px;font-weight:500;}.brand-sub{font-size:10px;color:var(--txt3);}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:100px;font-weight:500;}
.p-ok{background:var(--green-bg);color:var(--green-txt);}
.p-sy{background:var(--warn-bg);color:var(--warn-txt);}
.p-er{background:var(--red-bg);color:var(--red-txt);}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.tabs{display:flex;overflow-x:auto;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.tabs::-webkit-scrollbar{height:0;}
.tab{flex-shrink:0;padding:10px 14px;font-size:13px;color:var(--txt2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.content{flex:1;padding:14px;overflow-y:auto;}
.sec{display:none;}.sec.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border-radius:var(--r);padding:12px;}
.kl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.kv{font-size:19px;font-weight:500;line-height:1.1;}
.kd{font-size:10px;margin-top:3px;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 15px;margin-bottom:10px;}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ct{font-size:13px;font-weight:500;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th{text-align:left;font-size:10px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding-bottom:7px;border-bottom:0.5px solid var(--border);}
td{padding:7px 0;border-bottom:0.5px solid var(--border);color:var(--txt2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.b{color:var(--txt);font-weight:500;}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}
.bg{background:var(--green-bg);color:var(--green-txt);}
.br{background:var(--red-bg);color:var(--red-txt);}
.bw{background:var(--warn-bg);color:var(--warn-txt);}
.bi{background:var(--info-bg);color:var(--info-txt);}
.bgr{background:var(--bg2);color:var(--txt2);}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.btn:hover{background:var(--bg2);}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-s{background:var(--green-bg);color:var(--green-txt);border-color:transparent;}
.btn-d{background:var(--red-bg);color:var(--red-txt);border-color:transparent;}
.btn-sm{padding:4px 9px;font-size:11px;}
.btn-full{width:100%;justify-content:center;padding:10px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;}
.field label{font-size:11px;color:var(--txt3);}
.fi{font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;width:100%;}
.fi:focus{border-color:var(--blue);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fc{grid-column:1/-1;}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.mrow:last-child{border-bottom:none;}
.ml{color:var(--txt2);}
.mv{font-weight:500;}
.prog{height:5px;background:var(--bg3);border-radius:3px;margin-top:4px;}
.pf{height:5px;border-radius:3px;}
.alert{display:flex;align-items:center;gap:7px;font-size:12px;padding:8px 10px;border-radius:var(--r);margin-bottom:6px;}
.ar{background:var(--red-bg);color:var(--red-txt);}
.aw{background:var(--warn-bg);color:var(--warn-txt);}
.ai{background:var(--info-bg);color:var(--info-txt);}
.ok-bar{background:var(--green-bg);color:var(--green-txt);border-radius:var(--r);padding:9px 12px;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.tbox{background:var(--bg2);border-radius:var(--r);padding:11px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tl{font-size:10px;color:var(--txt3);}
.tv{font-size:19px;font-weight:500;}
.vcard{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.av{width:36px;height:36px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--info-txt);flex-shrink:0;}
.filtros{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.fb{font-size:11px;padding:4px 10px;border-radius:100px;border:0.5px solid var(--border2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.fb.active{background:var(--info-bg);color:var(--info-txt);border-color:var(--blue);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.mtitle{font-size:14px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.ie{width:60px;font-size:12px;padding:3px 6px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div><div class="brand">CCD Prime ERP</div><div class="brand-sub">Casa do Curativo · Firebase Sync</div></div>
    <div id="spill" class="pill p-sy"><span class="pdot"></span><span id="stxt">Conectando...</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="goTab('dashboard',this)">Dashboard</button>
    <button class="tab" onclick="goTab('pdv',this)">PDV</button>
    <button class="tab" onclick="goTab('estoque',this)">Estoque</button>
    <button class="tab" onclick="goTab('produtos',this)">Produtos</button>
    <button class="tab" onclick="goTab('vendedores',this)">Vendedores</button>
    <button class="tab" onclick="goTab('financeiro',this)">Financeiro</button>
    <button class="tab" onclick="goTab('metas',this)">Metas</button>
  </div>
  <div class="content">
    <div class="sec active" id="sec-dashboard"></div>
    <div class="sec" id="sec-pdv"></div>
    <div class="sec" id="sec-estoque"></div>
    <div class="sec" id="sec-produtos"></div>
    <div class="sec" id="sec-vendedores"></div>
    <div class="sec" id="sec-financeiro"></div>
    <div class="sec" id="sec-metas"></div>
  </div>
</div>
<div id="modal-wrap" style="display:none"></div>
<script>
const FB="https://ccd-prime-erp-default-rtdb.firebaseio.com/ccd.json";
const CATS=["CURATIVO","PRODUTO HOSPITALAR","SUPLEMENTAÇÃO","DECREÍNA"];
const PAGS=["PIX","Cartão crédito","Cartão débito","Dinheiro","Crediário"];
const DEF={produtos:[{id:1,nome:"Curativo de prata",familia:"CURATIVO",compra:17.58,venda:80,estoque:180},{id:2,nome:"Alginato de cálcio",familia:"CURATIVO",compra:5.42,venda:50,estoque:190},{id:3,nome:"Espuma",familia:"CURATIVO",compra:8.97,venda:80,estoque:30},{id:4,nome:"Hidrogel",familia:"CURATIVO",compra:12.07,venda:70,estoque:42},{id:5,nome:"Hidrofibra",familia:"CURATIVO",compra:13.75,venda:80,estoque:110},{id:6,nome:"Sol. PHMB",familia:"CURATIVO",compra:51.47,venda:130,estoque:11},{id:7,nome:"Spray barreira",familia:"CURATIVO",compra:27.77,venda:65,estoque:35},{id:8,nome:"Creme barreira",familia:"CURATIVO",compra:35.67,venda:90,estoque:8},{id:9,nome:"Generacell",familia:"CURATIVO",compra:82.9,venda:124.35,estoque:4},{id:10,nome:"Óleo girassol",familia:"CURATIVO",compra:2.97,venda:12,estoque:40},{id:11,nome:"Algodão 500g",familia:"PRODUTO HOSPITALAR",compra:14.49,venda:21.9,estoque:3},{id:12,nome:"SF 0,9%",familia:"PRODUTO HOSPITALAR",compra:4,venda:5,estoque:21},{id:13,nome:"Filme Transparente",familia:"PRODUTO HOSPITALAR",compra:56,venda:130,estoque:3},{id:14,nome:"Fralda G/EG",familia:"PRODUTO HOSPITALAR",compra:33.99,venda:60,estoque:3},{id:15,nome:"Bolsa colostomia",familia:"PRODUTO HOSPITALAR",compra:12,venda:22,estoque:38},{id:16,nome:"Seringa 5ml",familia:"PRODUTO HOSPITALAR",compra:0.33,venda:1,estoque:76},{id:17,nome:"Aparelho pressão",familia:"PRODUTO HOSPITALAR",compra:109,venda:149,estoque:1},{id:18,nome:"Whey",familia:"SUPLEMENTAÇÃO",compra:53.22,venda:95,estoque:12},{id:19,nome:"SOY Whey",familia:"SUPLEMENTAÇÃO",compra:99.88,venda:150,estoque:8},{id:20,nome:"Arginina",familia:"SUPLEMENTAÇÃO",compra:66.55,venda:100,estoque:4},{id:21,nome:"Colageno",familia:"SUPLEMENTAÇÃO",compra:22.11,venda:40,estoque:6},{id:22,nome:"Vit. C",familia:"SUPLEMENTAÇÃO",compra:18.77,venda:35,estoque:20},{id:23,nome:"Gotas Decreína",familia:"DECREÍNA",compra:42,venda:85,estoque:4},{id:24,nome:"Queratolítico",familia:"DECREÍNA",compra:40,venda:80,estoque:5}],vendedores:[{id:1,nome:"Ana Lima",meta:30000,ativo:true},{id:2,nome:"Carlos Reis",meta:25000,ativo:true},{id:3,nome:"Maria Silva",meta:35000,ativo:true}],vendas:[],metas:{faturamento:144000,lucro:43000,ticket:200,clientes:60},nextPId:100,nextVId:10,nextVendaId:1};
let DB=JSON.parse(JSON.stringify(DEF));
let secao="dashboard",modal=null,mD={};
let estF="Todos",estB="",prodB="";
let pId="",pQtd=1,pDesc=0,pPag="PIX",pVend="",pCli="",pOK=false;
let ieId=null,ieVal=0;
let saving=false;
const BRL=v=>"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const PCT=v=>Number(v).toFixed(1)+"%";
const mg=(c,v)=>v>0?Math.round(((v-c)/v)*100):0;
const hoje=()=>new Date().toLocaleDateString("pt-BR");
const bdg=(t,tx)=>`<span class="badge ${t}">${tx}</span>`;
function setStat(cls,txt){const p=document.getElementById("spill");p.className="pill "+cls;document.getElementById("stxt").textContent=txt;}
async function fbGet(){const r=await fetch(FB);if(!r.ok)throw new Error(r.status);return await r.json();}
async function fbSet(d){const r=await fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status);}
async function carregar(){setStat("p-sy","Conectando...");try{const d=await fbGet();if(d&&d.produtos)DB={...DEF,...d};else await fbSet(DB);setStat("p-ok","Sincronizado ✓");}catch(e){setStat("p-er","Modo offline");}rerender();setInterval(async()=>{try{const d=await fbGet();if(d&&d.produtos&&JSON.stringify(d)!==JSON.stringify(DB)){DB={...DEF,...d};setStat("p-ok","Atualizado ✓");rerender();}}catch(e){}},10000);}
async function salvar(){if(saving)return;saving=true;setStat("p-sy","Salvando...");try{await fbSet(DB);setStat("p-ok","Salvo ✓");}catch(e){setStat("p-er","Erro ao salvar");}saving=false;}
function goTab(id,el){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));if(el)el.classList.add("active");document.querySelectorAll(".sec").forEach(s=>s.classList.remove("active"));document.getElementById("sec-"+id).classList.add("active");secao=id;rerender();}
function rerender(){render(secao);}
function render(id){const el=document.getElementById("sec-"+id);if(!el)return;if(id==="dashboard")rDash(el);else if(id==="pdv")rPDV(el);else if(id==="estoque")rEst(el);else if(id==="produtos")rProd(el);else if(id==="vendedores")rVend(el);else if(id==="financeiro")rFin(el);else if(id==="metas")rMetas(el);}
function rDash(el){const{produtos,vendas,metas,vendedores}=DB;const fat=vendas.reduce((a,v)=>a+v.valor,0);const luc=vendas.reduce((a,v)=>a+v.lucro,0);const tk=vendas.length?fat/vendas.length:0;const zero=produtos.filter(p=>p.estoque===0);const crit=produtos.filter(p=>p.estoque>0&&p.estoque<=3);const alertas=[...zero.map(p=>({t:"r",m:`${p.nome} — zerado`})),...crit.map(p=>({t:"w",m:`${p.nome} — ${p.estoque} un.`}))];el.innerHTML=`<div class="kpi-grid"><div class="kpi"><div class="kl">Faturamento mês</div><div class="kv">${BRL(fat)}</div><div class="kd" style="color:var(--${fat>=metas.faturamento?"green":"warn"}-txt)">${Math.round((fat/(metas.faturamento||1))*100)}% da meta</div></div><div class="kpi"><div class="kl">Lucro líquido</div><div class="kv">${BRL(luc)}</div><div class="kd" style="color:var(--${luc>=metas.lucro?"green":"warn"}-txt)">${Math.round((luc/(metas.lucro||1))*100)}% da meta</div></div><div class="kpi"><div class="kl">Ticket médio</div><div class="kv">${BRL(tk)}</div></div><div class="kpi"><div class="kl">Vendas</div><div class="kv">${vendas.length}</div></div><div class="kpi"><div class="kl">Zerados</div><div class="kv" style="color:var(--${zero.length?"red":"green"}-txt)">${zero.length}</div></div><div class="kpi"><div class="kl">Críticos</div><div class="kv" style="color:var(--${crit.length?"warn":"green"}-txt)">${crit.length}</div></div></div><div class="row2"><div class="card">${alertas.length?`<div class="ct" style="margin-bottom:8px">Alertas</div>${alertas.slice(0,5).map(a=>`<div class="alert a${a.t}">${a.m}</div>`).join("")}`:`<div style="font-size:12px;color:var(--green-txt)">✓ Estoque saudável</div>`}</div><div class="card"><div class="ct" style="margin-bottom:8px">Top margem</div>${[...produtos].sort((a,b)=>mg(b.compra,b.venda)-mg(a.compra,a.venda)).slice(0,5).map(p=>`<div class="mrow"><span class="ml">${p.nome}</span><span style="color:var(--green-txt);font-weight:500">${mg(p.compra,p.venda)}%</span></div>`).join("")}</div></div><div class="card"><div class="ct" style="margin-bottom:8px">Últimas vendas</div><div style="overflow-x:auto"><table><thead><tr><th>Cliente</th><th>Produto</th><th>Valor</th><th>Lucro</th><th>Vendedor</th><th>Data</th></tr></thead><tbody>${[...vendas].reverse().slice(0,8).map(v=>`<tr><td class="b">${v.cliente}</td><td>${v.produto}</td><td class="b">${BRL(v.valor)}</td><td style="color:var(--green-txt)">${BRL(v.lucro)}</td><td>${v.vendedor}</td><td style="color:var(--txt3)">${v.data}</td></tr>`).join("")}${!vendas.length?`<tr><td colspan="6" style="text-align:center;color:var(--txt3);padding:12px">Nenhuma venda ainda.</td></tr>`:""}</tbody></table></div></div>`;}
function rPDV(el){const disp=DB.produtos.filter(p=>p.estoque>0);const ps=DB.produtos.find(p=>String(p.id)===String(pId));const tot=ps?+(ps.venda*pQtd*(1-pDesc/100)).toFixed(2):0;const luc=ps?+((ps.venda-ps.compra)*pQtd*(1-pDesc/100)).toFixed(2):0;const va=DB.vendedores.filter(v=>v.ativo);if(!pVend&&va.length)pVend=va[0].nome;el.innerHTML=`${pOK?`<div class="ok-bar">✓ Venda registrada e sincronizada!</div>`:""}<div class="card"><div class="ct" style="margin-bottom:10px">Registrar venda</div><div class="field"><label>Cliente *</label><input class="fi" id="pcli" placeholder="Nome do cliente" value="${pCli}" oninput="pCli=this.value"></div><div class="field"><label>Produto *</label><select class="fi" onchange="pId=this.value;rerender()"><option value="">— Selecione —</option>${disp.map(p=>`<option value="${p.id}"${String(p.id)===String(pId)?" selected":""}>${p.nome} — ${BRL(p.venda)} (${p.estoque} un.)</option>`).join("")}</select></div><div class="f2"><div class="field"><label>Quantidade</label><input class="fi" type="number" min="1" value="${pQtd}" oninput="pQtd=Math.max(1,parseInt(this.value)||1);rerender()"></div><div class="field"><label>Desconto %</label><input class="fi" type="number" min="0" max="50" value="${pDesc}" oninput="pDesc=Math.min(50,Math.max(0,parseFloat(this.value)||0));rerender()"></div><div class="field"><label>Pagamento</label><select class="fi" onchange="pPag=this.value">${PAGS.map(p=>`<option${p===pPag?" selected":""}>${p}</option>`).join("")}</select></div><div class="field"><label>Vendedor</label><select class="fi" onchange="pVend=this.value">${va.map(v=>`<option${v.nome===pVend?" selected":""}>${v.nome}</option>`).join("")}</select></div></div>${ps?`<div style="background:var(--bg2);border-radius:var(--r);padding:9px;font-size:12px;margin:4px 0"><b>${ps.nome}</b> · Margem <span style="color:var(--green-txt);font-weight:500">${mg(ps.compra,ps.venda)}%</span> · Lucro unit. <span style="color:var(--green-txt);font-weight:500">${BRL(ps.venda-ps.compra)}</span></div>`:""}<div class="tbox"><div><div class="tl">Total</div><div class="tv">${BRL(tot)}</div></div><div><div class="tl">Lucro est.</div><div class="tv" style="color:var(--green-txt)">${BRL(luc)}</div></div></div><button class="btn btn-p btn-full" onclick="finalizarVenda()">✓ Finalizar e salvar venda</button></div>`;}
async function finalizarVenda(){const cli=document.getElementById("pcli")?.value||pCli;const ps=DB.produtos.find(p=>String(p.id)===String(pId));if(!cli.trim()||!ps||!pVend){alert("Preencha cliente, produto e vendedor.");return;}const tot=+(ps.venda*pQtd*(1-pDesc/100)).toFixed(2);const luc=+((ps.venda-ps.compra)*pQtd*(1-pDesc/100)).toFixed(2);DB.vendas.push({id:DB.nextVendaId++,cliente:cli.trim(),produto:ps.nome,produtoId:ps.id,qtd:pQtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:hoje()});DB.produtos=DB.produtos.map(p=>p.id===ps.id?{...p,estoque:Math.max(0,p.estoque-pQtd)}:p);pCli="";pId="";pQtd=1;pDesc=0;pOK=true;await salvar();rerender();setTimeout(()=>{pOK=false;rerender();},2500);}
function rEst(el){const lista=DB.produtos.filter(p=>estF==="Todos"||p.familia===estF).filter(p=>p.nome.toLowerCase().includes(estB.toLowerCase()));const val=DB.produtos.reduce((a,p)=>a+p.compra*p.estoque,0);el.innerHTML=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)"><div class="kpi"><div class="kl">SKUs</div><div class="kv">${DB.produtos.length}</div></div><div class="kpi"><div class="kl">Zerados</div><div class="kv" style="color:var(--red-txt)">${DB.produtos.filter(p=>p.estoque===0).length}</div></div><div class="kpi"><div class="kl">Críticos</div><div class="kv" style="color:var(--warn-txt)">${DB.produtos.filter(p=>p.estoque>0&&p.estoque<=3).length}</div></div><div class="kpi"><div class="kl">Valor estoque</div><div class="kv" style="font-size:13px">${BRL(val)}</div></div></div><div class="card"><div class="chd"><div class="ct">Movimentação</div></div><input class="fi" style="margin-bottom:8px" placeholder="Buscar..." value="${estB}" oninput="estB=this.value;rerender()"><div class="filtros">${["Todos",...CATS].map(f=>`<button class="fb${estF===f?" active":""}" onclick="estF='${f}';rerender()">${f.split(" ")[0]}</button>`).join("")}</div>${lista.map(p=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)"><div style="flex:1;min-width:0;margin-right:8px"><div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.nome}</div><div style="font-size:11px;color:var(--txt3)">${p.familia.split(" ")[0]} · ${BRL(p.compra)} → ${BRL(p.venda)} · <span style="color:var(--green-txt);font-weight:500">${mg(p.compra,p.venda)}%</span></div></div><div style="display:flex;align-items:center;gap:5px;flex-shrink:0">${ieId===p.id?`<input class="ie" type="number" value="${ieVal}" oninput="ieVal=parseInt(this.value)||0"><button class="btn btn-s btn-sm" onclick="salvarEst(${p.id})">✓</button><button class="btn btn-sm" onclick="ieId=null;rerender()">✕</button>`:`${bdg(p.estoque===0?"br":p.estoque<=3?"bw":"bg",p.estoque+" un.")}<button class="btn btn-sm" onclick="ieId=${p.id};ieVal=${p.estoque};rerender()">✏</button>`}</div></div>`).join("")}</div>`;}
async function salvarEst(id){DB.produtos=DB.produtos.map(p=>p.id===id?{...p,estoque:Math.max(0,ieVal)}:p);ieId=null;await salvar();rerender();}
function rProd(el){const lista=DB.produtos.filter(p=>p.nome.toLowerCase().includes(prodB.toLowerCase()));el.innerHTML=`<div class="card"><div class="chd"><div class="ct">Catálogo (${DB.produtos.length})</div><button class="btn btn-p btn-sm" onclick="abrirMProd(null)">+ Novo produto</button></div><input class="fi" style="margin-bottom:8px" placeholder="Buscar..." value="${prodB}" oninput="prodB=this.value;rerender()">${lista.map(p=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)"><div style="flex:1;min-width:0;margin-right:8px;cursor:pointer" onclick="abrirMProd(${p.id})"><div style="font-size:13px;font-weight:500">${p.nome}</div><div style="font-size:11px;color:var(--txt3)">${p.familia.split(" ")[0]} · ${BRL(p.compra)} → ${BRL(p.venda)} · <span style="color:var(--green-txt);font-weight:500">${mg(p.compra,p.venda)}%</span></div></div><div style="display:flex;gap:4px;flex-shrink:0;align-items:center">${bdg(p.estoque===0?"br":p.estoque<=3?"bw":"bg",p.estoque)}<button class="btn btn-sm" onclick="abrirMProd(${p.id})">✏</button><button class="btn btn-d btn-sm" onclick="delProd(${p.id})">🗑</button></div></div>`).join("")}</div>`;}
function abrirMProd(id){mD=id?{...DB.produtos.find(p=>p.id===id)}:{nome:"",familia:CATS[0],compra:"",venda:"",estoque:"",id:null};const prev=+mD.compra>0&&+mD.venda>0?`<div style="background:var(--bg2);border-radius:var(--r);padding:8px;font-size:12px;margin-bottom:8px">Lucro: <b>${BRL(+mD.venda-+mD.compra)}</b> · Margem: <b>${mg(+mD.compra,+mD.venda)}%</b></div>`:"";document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box"><div class="mtitle">${id?"Editar produto":"Novo produto"}<button class="btn btn-sm" onclick="fecharModal()">✕</button></div><div class="f2"><div class="field fc"><label>Nome *</label><input class="fi" id="mpn" value="${mD.nome||""}" placeholder="Nome do produto" oninput="mD.nome=this.value"></div><div class="field fc"><label>Categoria</label><select class="fi" onchange="mD.familia=this.value">${CATS.map(c=>`<option${c===(mD.familia||CATS[0])?" selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>Preço compra (R$)</label><input class="fi" type="number" step="0.01" value="${mD.compra||""}" placeholder="0.00" oninput="mD.compra=parseFloat(this.value)||0"></div><div class="field"><label>Preço venda (R$)</label><input class="fi" type="number" step="0.01" value="${mD.venda||""}" placeholder="0.00" oninput="mD.venda=parseFloat(this.value)||0"></div><div class="field fc"><label>Estoque</label><input class="fi" type="number" value="${mD.estoque||""}" placeholder="0" oninput="mD.estoque=parseInt(this.value)||0"></div></div>${prev}<div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarProd()">✓ Salvar produto</button></div></div></div>`;document.getElementById("modal-wrap").style.display="block";}
function fecharModal(){document.getElementById("modal-wrap").style.display="none";document.getElementById("modal-wrap").innerHTML="";}
async function salvarProd(){const d=mD;if(!d.nome||!(+d.venda>0)){alert("Nome e preço de venda obrigatórios.");return;}const p={...d,compra:+d.compra||0,venda:+d.venda,estoque:+d.estoque||0};if(p.id)DB.produtos=DB.produtos.map(x=>x.id===p.id?p:x);else{p.id=DB.nextPId++;DB.produtos.push(p);}fecharModal();await salvar();rerender();}
async function delProd(id){if(!confirm("Remover produto?"))return;DB.produtos=DB.produtos.filter(p=>p.id!==id);await salvar();rerender();}
function rVend(el){el.innerHTML=`<div class="card"><div class="chd"><div class="ct">Equipe (${DB.vendedores.length})</div><button class="btn btn-p btn-sm" onclick="abrirMVend(null)">+ Novo vendedor</button></div>${DB.vendedores.map(v=>{const vv=DB.vendas.filter(x=>x.vendedor===v.nome);const fat=vv.reduce((a,x)=>a+x.valor,0);const pct=v.meta>0?(fat/v.meta)*100:0;const ini=v.nome.split(" ").map(n=>n[0]).slice(0,2).join("");return `<div class="vcard"><div class="av">${ini}</div><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-weight:500;font-size:13px">${v.nome}</span>${bdg(v.ativo?"bg":"bgr",v.ativo?"Ativo":"Inativo")}</div><div style="font-size:11px;color:var(--txt3);margin-bottom:5px">Meta: ${BRL(v.meta)} · Realizado: ${BRL(fat)} · ${vv.length} vendas</div><div class="prog"><div class="pf" style="width:${Math.min(100,Math.round(pct))}%;background:${pct>=100?"#639922":"#378ADD"}"></div></div><div style="font-size:10px;color:${pct>=100?"var(--green-txt)":"var(--txt3)"};margin-top:2px">${Math.round(pct)}% da meta</div></div><div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="abrirMVend(${v.id})">✏</button><button class="btn btn-d btn-sm" onclick="delVend(${v.id})">🗑</button></div></div>`;}).join("")}</div>`;}
function abrirMVend(id){mD=id?{...DB.vendedores.find(v=>v.id===id)}:{nome:"",meta:"",ativo:true,id:null};document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box"><div class="mtitle">${id?"Editar vendedor":"Novo vendedor"}<button class="btn btn-sm" onclick="fecharModal()">✕</button></div><div class="field"><label>Nome *</label><input class="fi" value="${mD.nome||""}" placeholder="Nome completo" oninput="mD.nome=this.value"></div><div class="field"><label>Meta mensal (R$) *</label><input class="fi" type="number" value="${mD.meta||""}" placeholder="Ex: 30000" oninput="mD.meta=parseFloat(this.value)||0"></div><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:12px"><input type="checkbox" ${mD.ativo?"checked":""} onchange="mD.ativo=this.checked"> Vendedor ativo</label><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarVend()">✓ Salvar</button></div></div></div>`;document.getElementById("modal-wrap").style.display="block";}
async function salvarVend(){const d=mD;if(!d.nome||!(+d.meta>0)){alert("Nome e meta obrigatórios.");return;}const v={...d,meta:+d.meta,ativo:!!d.ativo};if(v.id)DB.vendedores=DB.vendedores.map(x=>x.id===v.id?v:x);else{v.id=DB.nextVId++;DB.vendedores.push(v);}fecharModal();await salvar();rerender();}
async function delVend(id){if(!confirm("Remover vendedor?"))return;DB.vendedores=DB.vendedores.filter(v=>v.id!==id);await salvar();rerender();}
function rFin(el){const{vendas}=DB;const fat=vendas.reduce((a,v)=>a+v.valor,0);const luc=vendas.reduce((a,v)=>a+v.lucro,0);const cmv=fat-luc;const desp=19800;const ll=luc-desp;const ml=fat>0?(ll/fat)*100:0;const porPag=vendas.reduce((acc,v)=>{acc[v.pagamento]=(acc[v.pagamento]||0)+v.valor;return acc;},{});el.innerHTML=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)"><div class="kpi"><div class="kl">Receita bruta</div><div class="kv" style="font-size:14px">${BRL(fat)}</div></div><div class="kpi"><div class="kl">CMV</div><div class="kv" style="font-size:14px">${BRL(cmv)}</div></div><div class="kpi"><div class="kl">Lucro bruto</div><div class="kv" style="font-size:14px">${BRL(luc)}</div><div class="kd" style="color:var(--green-txt)">${PCT(fat>0?(luc/fat)*100:0)}</div></div><div class="kpi"><div class="kl">Lucro líquido</div><div class="kv" style="font-size:14px;color:var(--${ll>=0?"green":"red"}-txt)">${BRL(ll)}</div><div class="kd" style="color:var(--${ll>=0?"green":"red"}-txt)">${PCT(ml)}</div></div></div><div class="row2"><div class="card"><div class="ct" style="margin-bottom:8px">DRE</div>${[["Receita bruta",fat,""],["(−) CMV",-cmv,"s"],["(=) Lucro bruto",luc,"ok"],["(−) Despesas",-desp,"s"],["(=) Lucro líquido",ll,ll>=0?"ok":"no"]].map(([l,v,t])=>`<div class="mrow" ${t==="ok"||t==="no"?`style="background:var(--${t==="ok"?"green":"red"}-bg);border-radius:var(--r);padding:6px 8px;margin:2px 0"`:""}}><span style="font-size:12px;color:var(--${t==="s"?"txt2":"txt"});${t!=="s"?"font-weight:500":""}">${l}</span><span style="font-weight:500;font-size:12px;color:var(--${t==="ok"?"green":t==="no"?"red":"txt"}-${t!=""?"txt":"txt"})">${v<0?"-":"+"}${BRL(Math.abs(v))}</span></div>`).join("")}</div><div class="card"><div class="ct" style="margin-bottom:8px">Por pagamento</div>${Object.keys(porPag).length?Object.entries(porPag).map(([k,v])=>`<div class="mrow"><span class="ml">${k}</span><div style="display:flex;gap:6px;align-items:center"><span class="mv">${BRL(v)}</span>${bdg("bgr",PCT((v/(fat||1))*100))}</div></div>`).join(""):`<div style="font-size:12px;color:var(--txt3)">Sem vendas ainda.</div>`}</div></div>`;}
function rMetas(el){const{vendas,metas}=DB;const fat=vendas.reduce((a,v)=>a+v.valor,0);const luc=vendas.reduce((a,v)=>a+v.lucro,0);const tk=vendas.length?fat/vendas.length:0;const cli=new Set(vendas.map(v=>v.cliente)).size;const itens=[{k:"faturamento",l:"Faturamento mensal",real:fat,c:"#378ADD"},{k:"lucro",l:"Lucro líquido",real:luc,c:"#639922"},{k:"ticket",l:"Ticket médio",real:tk,c:"#EF9F27"},{k:"clientes",l:"Clientes únicos",real:cli,c:"#D4537E"}];el.innerHTML=`<div class="card"><div class="chd"><div class="ct">Metas do mês</div><button class="btn btn-sm" onclick="abrirMMetas()">✏ Editar</button></div>${itens.map(it=>{const pct=metas[it.k]>0?(it.real/metas[it.k])*100:0;const ok=pct>=100;return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:500">${it.l}</span><span style="font-size:11px;color:var(--txt2)">${it.k==="clientes"?`${Math.round(it.real)} / ${metas[it.k]}`:`${BRL(it.real)} / ${BRL(metas[it.k])}`}</span></div><div class="prog"><div class="pf" style="width:${Math.min(100,Math.round(pct))}%;background:${ok?"#639922":it.c}"></div></div><div style="font-size:10px;color:${ok?"var(--green-txt)":"var(--txt3)"};margin-top:2px">${ok?"Meta atingida ✓":Math.round(pct)+"% concluído"}</div></div>`;}).join("")}</div>`;}
function abrirMMetas(){const{metas}=DB;document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box"><div class="mtitle">Editar metas<button class="btn btn-sm" onclick="fecharModal()">✕</button></div>${[["faturamento","Faturamento mensal (R$)"],["lucro","Lucro líquido (R$)"],["ticket","Ticket médio (R$)"],["clientes","Clientes únicos"]].map(([k,l])=>`<div class="field"><label>${l}</label><input class="fi" type="number" id="mt${k}" value="${metas[k]}"></div>`).join("")}<button class="btn btn-p btn-full" onclick="salvarMetas()">✓ Salvar metas</button></div></div>`;document.getElementById("modal-wrap").style.display="block";}
async function salvarMetas(){DB.metas={faturamento:+document.getElementById("mtfaturamento").value||0,lucro:+document.getElementById("mtlucro").value||0,ticket:+document.getElementById("mtticket").value||0,clientes:+document.getElementById("mtclientes").value||0};fecharModal();await salvar();rerender();}
carregar();
</script>
</body>
