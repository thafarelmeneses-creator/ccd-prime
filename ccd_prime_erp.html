<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCD Prime ERP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#e8e8e6;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#9ca3af;--bor:rgba(0,0,0,0.1);--bor2:rgba(0,0,0,0.18);--gbg:#eaf3de;--gtxt:#3b6d11;--rbg:#fcebeb;--rtxt:#a32d2d;--wbg:#faeeda;--wtxt:#854f0b;--ibg:#e6f1fb;--itxt:#185fa5;--blue:#378ADD;--r:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--bor:rgba(255,255,255,0.1);--bor2:rgba(255,255,255,0.2);--gbg:#173404;--gtxt:#97c459;--rbg:#501313;--rtxt:#f09595;--wbg:#412402;--wtxt:#fac775;--ibg:#042c53;--itxt:#85b7eb;}}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.wrap{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--bor);flex-shrink:0;}
.brand{font-size:15px;font-weight:500;}.brand-sub{font-size:10px;color:var(--txt3);}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:100px;font-weight:500;}
.p-ok{background:var(--gbg);color:var(--gtxt);}.p-sy{background:var(--wbg);color:var(--wtxt);}.p-er{background:var(--rbg);color:var(--rtxt);}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.user-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:var(--r);background:var(--bg2);cursor:pointer;border:0.5px solid var(--bor);}
.tabs{display:flex;overflow-x:auto;border-bottom:0.5px solid var(--bor);flex-shrink:0;}
.tabs::-webkit-scrollbar{height:0;}
.tab{flex-shrink:0;padding:10px 13px;font-size:12px;color:var(--txt2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.tab.hidden{display:none;}
.content{flex:1;padding:14px;overflow-y:auto;}
.sec{display:none;}.sec.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border-radius:var(--r);padding:12px;}
.kl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.kv{font-size:19px;font-weight:500;line-height:1.1;}.kd{font-size:10px;margin-top:3px;}
.card{background:var(--bg);border:0.5px solid var(--bor);border-radius:var(--rl);padding:13px 15px;margin-bottom:10px;}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.ct{font-size:13px;font-weight:500;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th{text-align:left;font-size:10px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding-bottom:7px;border-bottom:0.5px solid var(--bor);}
td{padding:7px 0;border-bottom:0.5px solid var(--bor);color:var(--txt2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}td.b{color:var(--txt);font-weight:500;}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}
.bg{background:var(--gbg);color:var(--gtxt);}.br{background:var(--rbg);color:var(--rtxt);}
.bw{background:var(--wbg);color:var(--wtxt);}.bi{background:var(--ibg);color:var(--itxt);}
.bgr{background:var(--bg2);color:var(--txt2);}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r);border:0.5px solid var(--bor2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.btn:hover{background:var(--bg2);}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-s{background:var(--gbg);color:var(--gtxt);border-color:transparent;}
.btn-d{background:var(--rbg);color:var(--rtxt);border-color:transparent;}
.btn-w{background:var(--wbg);color:var(--wtxt);border-color:transparent;}
.btn-i{background:var(--ibg);color:var(--itxt);border-color:transparent;}
.btn-sm{padding:4px 9px;font-size:11px;}.btn-full{width:100%;justify-content:center;padding:10px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;}
.field label{font-size:11px;color:var(--txt3);}
.fi{font-size:13px;padding:8px 10px;border:0.5px solid var(--bor2);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;width:100%;}
.fi:focus{border-color:var(--blue);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fc{grid-column:1/-1;}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:0.5px solid var(--bor);}
.mrow:last-child{border-bottom:none;}.ml{color:var(--txt2);}.mv{font-weight:500;}
.prog{height:5px;background:var(--bg3);border-radius:3px;margin-top:4px;}
.pf{height:5px;border-radius:3px;}
.alert{display:flex;align-items:center;gap:7px;font-size:12px;padding:8px 10px;border-radius:var(--r);margin-bottom:6px;}
.ar{background:var(--rbg);color:var(--rtxt);}.aw{background:var(--wbg);color:var(--wtxt);}.ai{background:var(--ibg);color:var(--itxt);}
.ok-bar{background:var(--gbg);color:var(--gtxt);border-radius:var(--r);padding:9px 12px;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.tbox{background:var(--bg2);border-radius:var(--r);padding:11px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tl{font-size:10px;color:var(--txt3);}.tv{font-size:19px;font-weight:500;}
.vcard{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.av{width:36px;height:36px;border-radius:50%;background:var(--ibg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--itxt);flex-shrink:0;}
.filtros{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.fb{font-size:11px;padding:4px 10px;border-radius:100px;border:0.5px solid var(--bor2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.fb.active{background:var(--ibg);color:var(--itxt);border-color:var(--blue);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg);border:0.5px solid var(--bor2);border-radius:var(--rl);padding:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.mtitle{font-size:14px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.ie{width:60px;font-size:12px;padding:3px 6px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--bor);}
.rank-item:last-child{border-bottom:none;}
.rank-num{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.therm{height:16px;background:var(--bg3);border-radius:8px;overflow:hidden;margin:6px 0;}
.therm-f{height:16px;border-radius:8px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:500;color:#fff;}
.nivel-card{border-radius:var(--rl);padding:14px;margin-bottom:8px;}
.compra-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--bor);font-size:13px;gap:8px;}
.compra-row:last-child{border-bottom:none;}
.evo-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:140px;margin:12px 0 4px;}
.evo-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;}
.evo-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;}
.evo-bar-lbl{font-size:9px;color:var(--txt3);text-align:center;white-space:nowrap;}
.evo-bar-val{font-size:9px;font-weight:500;color:var(--txt2);text-align:center;white-space:nowrap;overflow:hidden;max-width:100%;}
.evo-mes-card{background:var(--bg2);border-radius:var(--rl);padding:12px;margin-bottom:8px;border:0.5px solid var(--bor);}
.conta-card{background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.forn-card{background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.login-box{background:var(--bg);border:0.5px solid var(--bor2);border-radius:var(--rl);padding:28px;width:100%;max-width:360px;}
.login-brand{text-align:center;margin-bottom:24px;}
.login-brand .lb{font-size:22px;font-weight:500;}
.login-brand .ls{font-size:12px;color:var(--txt3);margin-top:4px;}
.login-err{background:var(--rbg);color:var(--rtxt);border-radius:var(--r);padding:8px 12px;font-size:12px;margin-bottom:12px;display:none;}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:0.5px solid var(--bor2);border-radius:var(--r);z-index:50;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.ac-item{padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--bor);}
.ac-item:last-child{border-bottom:none;}.ac-item:hover{background:var(--bg2);}
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <div class="lb">CCD Prime ERP</div>
      <div class="ls">Casa do Curativo</div>
    </div>
    <div id="login-err" class="login-err">Usuario ou senha incorretos.</div>
    <div class="field">
      <label>Usuario</label>
      <input class="fi" id="l-user" placeholder="Seu nome">
    </div>
    <div class="field">
      <label>Senha</label>
      <input class="fi" type="password" id="l-pass" placeholder="Sua senha">
    </div>
    <button class="btn btn-p btn-full" id="btn-entrar" style="margin-top:4px">Entrar</button>
    <div style="margin-top:16px;padding-top:14px;border-top:0.5px solid var(--bor);text-align:center">
      <div style="font-size:11px;color:var(--txt3);margin-bottom:8px">Problemas para entrar? Redefina as senhas.</div>
      <button class="btn btn-full" style="font-size:11px" id="btn-reset">Resetar usuarios para o padrao</button>
    </div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="topbar">

    <button class="tab" data-tab="fornecedores" onclick="goTab('fornecedores',this)">Fornecedores</button>
    <button class="tab" data-tab="financeiro" onclick="goTab('financeiro',this)">Financeiro</button>
    <button class="tab" data-tab="contas" onclick="goTab('contas',this)">Contas a Pagar</button>
    <button class="tab" data-tab="vendas" onclick="goTab('vendas',this)">Vendas</button>
    <button class="tab" data-tab="metas" onclick="goTab('metas',this)">Metas</button>
    <button class="tab" data-tab="evolucao" onclick="goTab('evolucao',this)">Evolucao</button>
    <button class="tab" data-tab="bonificacao" onclick="goTab('bonificacao',this)">Bonus</button>
    <button class="tab" data-tab="compras" onclick="goTab('compras',this)">Compras</button>
    <button class="tab" data-tab="usuarios" onclick="goTab('usuarios',this)">Usuarios</button>
  </div>
  <div class="content">
    <div class="sec active" id="sec-dashboard"></div>
    <div class="sec" id="sec-pdv"></div>
    <div class="sec" id="sec-estoque"></div>
    <div class="sec" id="sec-produtos"></div>
    <div class="sec" id="sec-vendedores"></div>
    <div class="sec" id="sec-clientes"></div>
    <div class="sec" id="sec-fornecedores"></div>
    <div class="sec" id="sec-financeiro"></div>
    <div class="sec" id="sec-contas"></div>
    <div class="sec" id="sec-vendas"></div>
    <div class="sec" id="sec-metas"></div>
    <div class="sec" id="sec-evolucao"></div>
    <div class="sec" id="sec-bonificacao"></div>
    <div class="sec" id="sec-compras"></div>
    <div class="sec" id="sec-usuarios"></div>
  </div>
</div>
<div id="modal-wrap" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

var secao = "dashboard";

var estF = "Todos", estB = "", prodB = "";
var pId = "", pQtd = "1", pDesc = "0", pPag = "PIX", pVend = "", pCli = "", pOK = false, pData = "", pBusca = "";

// ── UTILS ──
function BRL(v){ return "R$ " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pct(v){ return Number(v).toFixed(1) + "%"; }
function mg(c,v){ return v > 0 ? Math.round(((v-c)/v)*100) : 0; }
function hoje(){ return new Date().toLocaleDateString("pt-BR"); }
function bdg(t,tx){ return '<span class="badge ' + t + '">' + tx + '</span>'; }
function isAdmin(){ return usuarioAtual && usuarioAtual.role === "admin"; }
function isAdminOuGerente(){ return usuarioAtual && (usuarioAtual.role === "admin" || usuarioAtual.role === "gerente"); }
function dataParaInput(d){
  if(!d) return new Date().toISOString().split("T")[0];
  var p = d.split("/");
  if(p.length === 3) return p[2] + "-" + p[1].padStart(2,"0") + "-" + p[0].padStart(2,"0");
  return d;
}
function inputParaData(d){
  if(!d) return hoje();
  var p = d.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function diasParaVencer(v){
  if(!v) return 999;
  var h = new Date(); h.setHours(0,0,0,0);
  var p = v.split("/");
  var d = new Date(+p[2], +p[1]-1, +p[0]);
  return Math.round((d - h) / 86400000);
}
function vendasDoMes(mes, ano){

  return (DB.vendas || []).filter(function(v){
    if(!v.data) return false;
    var p = v.data.split("/");
    if(p.length !== 3) return false;
    return p[1].padStart(2,"0") === m && p[2] === a;
  });
}
function mesAtualStr(){
  return new Date().toLocaleString("pt-BR", {month:"long", year:"numeric"});
}
function mesAtualKey(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function getSemana(){
  var d = new Date().getDate();
  return d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4;
}
function arquivarMes(){
  var key = mesAtualKey();
  if(!DB.historico) DB.historico = [];
  var vMes = vendasDoMes();
  var fat = vMes.reduce(function(a,v){ return a + v.valor; }, 0);
  if(!fat) return;
  var mes = String(new Date().getMonth()+1).padStart(2,"0");
  var ano = String(new Date().getFullYear());
  var luc = vMes.reduce(function(a,v){ return a + v.lucro; }, 0);
  var ticket = vMes.length ? fat / vMes.length : 0;
  var ex = DB.historico.find(function(h){ return h.id === key; });
  if(ex && !ex.manual){ ex.fat = fat; ex.lucro = luc; ex.vendas = vMes.length; ex.ticket = ticket; }
  else if(!ex){ DB.historico.push({id:key,mes:mes,ano:ano,fat:fat,lucro:luc,vendas:vMes.length,ticket:ticket,nota:"Auto",manual:false}); }
}

async function fbSet(d){

async function carregar(){
  setStat("p-sy", "Conectando...");
  function toArr(v){ if(!v) return []; if(Array.isArray(v)) return v; return Object.values(v); }
  function mergeDB(d){
    var r = Object.assign({}, DEF);
    if(d.produtos && toArr(d.produtos).length > 0) r.produtos = toArr(d.produtos);
    if(d.vendedores && toArr(d.vendedores).length > 0) r.vendedores = toArr(d.vendedores);
    if(d.vendas) r.vendas = toArr(d.vendas);
    if(d.historico) r.historico = toArr(d.historico);
    if(d.contas) r.contas = toArr(d.contas);
    if(d.fornecedores) r.fornecedores = toArr(d.fornecedores);
    if(d.pedidos) r.pedidos = toArr(d.pedidos);
    if(d.compras) r.compras = toArr(d.compras);
    if(d.usuarios) r.usuarios = toArr(d.usuarios);
    if(d.metas) r.metas = d.metas;
    ['nextVendaId','nextPId','nextVId','nextContaId','nextFornId','nextPedId','nextCompraId'].forEach(function(k){ if(d[k]) r[k] = d[k]; });
    return r;
  }
  try{
    var d = await fbGet();
    if(d) DB = mergeDB(d);
    setStat("p-ok", "Sincronizado");
  } catch(e){ setStat("p-er", "Offline"); }
  rerender();
  setInterval(async function(){
    try{
      var d = await fbGet();
      if(d){
        var newDB = mergeDB(d);
        if(JSON.stringify(newDB) !== JSON.stringify(DB)){
          DB = newDB;
          setStat("p-ok", "Atualizado");
          rerender();
        }
      }
    } catch(e){}
  }, 12000);
}

  saving = false;
}

    html+='<div class="av" style="width:32px;height:32px;font-size:11px">'+ini+'</div>';
    html+='<div style="flex:1"><div style="font-size:13px;font-weight:500">'+cli+'</div><div style="font-size:11px;color:var(--txt3)">'+cs.length+' compra(s) - '+BRL(fat)+'</div></div><span style="font-size:11px;color:var(--txt3)">v</span></div>';
    html+='<div id="c_'+safeId+'" style="display:none;padding:10px 12px">';

async function salvarForn(){var d=mD;if(!d.nome){alert("Nome obrigatorio.");return;}if(!DB.fornecedores)DB.fornecedores=[];var f=Object.assign({},d);if(f.id)DB.fornecedores=DB.fornecedores.map(function(x){return x.id===f.id?f:x;});else{f.id=DB.nextFornId++;DB.fornecedores.push(f);}fecharModal();await salvar();rerender();}

  if(!DB.compras)DB.compras=[];
  if(DB.compras.find(function(x){return x.pedidoId===p.id;})) return;
  DB.compras.push({id:Date.now()+(Math.random()*1000|0),pedidoId:p.id,fornecedor:p.fornecedor||"",descricao:p.produto||"",valor:+p.valor||0,categoria:"Produtos A",semana:getSemana(),data:p.data||hoje(),dataiso:new Date().toISOString()});
}
function abrirMPedido(fornId){
  var f=DB.fornecedores.find(function(x){return x.id===fornId;});
  mD={fornecedorId:fornId,fornecedor:f?f.nome:"",produto:"",qtd:"",valor:"",data:hoje(),status:"aguardando",id:null};

async function salvarPedido(){

async function salvarUser(){
  var d=mD; if(!d.nome||!d.senha||d.senha.length<4){alert("Nome e senha (min 4) sao obrigatorios.");return;}
  if(!DB.usuarios)DB.usuarios=JSON.parse(JSON.stringify(USERS_DEFAULT));
  var u=Object.assign({},d,{ativo:!!d.ativo});
  if(u.id)DB.usuarios=DB.usuarios.map(function(x){return x.id===u.id?u:x;});
  else{u.id=Date.now();DB.usuarios.push(u);}
  fecharModal(); await salvar(); rerender();
}
async function delUser(id){if(!confirm("Remover usuario?"))return;if(!DB.usuarios)DB.usuarios=JSON.parse(JSON.stringify(USERS_DEFAULT));DB.usuarios=DB.usuarios.filter(function(u){return u.id!==id;});await salvar();rerender();}
