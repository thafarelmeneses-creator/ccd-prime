<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCD Prime ERP — Casa do Curativo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#e8e8e6;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#9ca3af;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--gbg:#eaf3de;--gtxt:#3b6d11;--rbg:#fcebeb;--rtxt:#a32d2d;--wbg:#faeeda;--wtxt:#854f0b;--ibg:#e6f1fb;--itxt:#185fa5;--blue:#378ADD;--r:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--gbg:#173404;--gtxt:#97c459;--rbg:#501313;--rtxt:#f09595;--wbg:#412402;--wtxt:#fac775;--ibg:#042c53;--itxt:#85b7eb;}}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--border);background:var(--bg);flex-shrink:0;}
.brand{font-size:15px;font-weight:500;}.brand-sub{font-size:10px;color:var(--txt3);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:100px;font-weight:500;}
.p-ok{background:var(--gbg);color:var(--gtxt);}.p-sy{background:var(--wbg);color:var(--wtxt);}.p-er{background:var(--rbg);color:var(--rtxt);}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.user-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:var(--r);background:var(--bg2);cursor:pointer;border:0.5px solid var(--border);}
.tabs{display:flex;overflow-x:auto;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.tabs::-webkit-scrollbar{height:0;}
.tab{flex-shrink:0;padding:10px 13px;font-size:12px;color:var(--txt2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.tab.hidden{display:none;}
.content{flex:1;padding:14px;overflow-y:auto;}
.sec{display:none;}.sec.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border-radius:var(--r);padding:12px;}
.kl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.kv{font-size:19px;font-weight:500;line-height:1.1;}.kd{font-size:10px;margin-top:3px;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 15px;margin-bottom:10px;}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.ct{font-size:13px;font-weight:500;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th{text-align:left;font-size:10px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding-bottom:7px;border-bottom:0.5px solid var(--border);}
td{padding:7px 0;border-bottom:0.5px solid var(--border);color:var(--txt2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}td.b{color:var(--txt);font-weight:500;}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}
.bg{background:var(--gbg);color:var(--gtxt);}.br{background:var(--rbg);color:var(--rtxt);}
.bw{background:var(--wbg);color:var(--wtxt);}.bi{background:var(--ibg);color:var(--itxt);}
.bgr{background:var(--bg2);color:var(--txt2);}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.btn:hover{background:var(--bg2);}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-s{background:var(--gbg);color:var(--gtxt);border-color:transparent;}
.btn-d{background:var(--rbg);color:var(--rtxt);border-color:transparent;}
.btn-w{background:var(--wbg);color:var(--wtxt);border-color:transparent;}
.btn-i{background:var(--ibg);color:var(--itxt);border-color:transparent;}
.btn-sm{padding:4px 9px;font-size:11px;}.btn-full{width:100%;justify-content:center;padding:10px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;}
.field label{font-size:11px;color:var(--txt3);}
.fi{font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;width:100%;}
.fi:focus{border-color:var(--blue);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fc{grid-column:1/-1;}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.mrow:last-child{border-bottom:none;}.ml{color:var(--txt2);}.mv{font-weight:500;}
.prog{height:5px;background:var(--bg3);border-radius:3px;margin-top:4px;}
.pf{height:5px;border-radius:3px;}
.alert{display:flex;align-items:center;gap:7px;font-size:12px;padding:8px 10px;border-radius:var(--r);margin-bottom:6px;}
.ar{background:var(--rbg);color:var(--rtxt);}.aw{background:var(--wbg);color:var(--wtxt);}
.ai{background:var(--ibg);color:var(--itxt);}
.ok-bar{background:var(--gbg);color:var(--gtxt);border-radius:var(--r);padding:9px 12px;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.tbox{background:var(--bg2);border-radius:var(--r);padding:11px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tl{font-size:10px;color:var(--txt3);}.tv{font-size:19px;font-weight:500;}
.vcard{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.av{width:36px;height:36px;border-radius:50%;background:var(--ibg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--itxt);flex-shrink:0;}
.filtros{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.fb{font-size:11px;padding:4px 10px;border-radius:100px;border:0.5px solid var(--border2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.fb.active{background:var(--ibg);color:var(--itxt);border-color:var(--blue);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.mtitle{font-size:14px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.ie{width:60px;font-size:12px;padding:3px 6px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--r);z-index:50;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.ac-item{padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--border);}
.ac-item:last-child{border-bottom:none;}.ac-item:hover{background:var(--bg2);}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.rank-item:last-child{border-bottom:none;}
.rank-num{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-name{font-size:13px;font-weight:500;color:var(--txt);}
.rank-sub{font-size:11px;color:var(--txt3);}
.rank-val{font-size:13px;font-weight:500;color:var(--gtxt);flex-shrink:0;margin-left:auto;}
.conta-card{background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.forn-card{background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.evo-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:140px;margin:12px 0 4px;}
.evo-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;}
.evo-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;}
.evo-bar-lbl{font-size:9px;color:var(--txt3);text-align:center;white-space:nowrap;}
.evo-bar-val{font-size:9px;font-weight:500;color:var(--txt2);text-align:center;white-space:nowrap;overflow:hidden;max-width:100%;}

/* METAS & BONUS */
.nivel-card{border-radius:var(--border-radius-lg);padding:14px;margin-bottom:8px;border:1.5px solid transparent;}
.nivel-base{background:#EAF3DE;border-color:#8BC34A;}
.nivel-cresc{background:#E6F1FB;border-color:#378ADD;}
.nivel-excel{background:#FFF3E0;border-color:#FF9800;}
.nivel-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.nivel-valor{font-size:22px;font-weight:500;margin-bottom:4px;}
.nivel-desc{font-size:12px;line-height:1.5;margin-bottom:8px;}
.bonus-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:100px;}
.bb-base{background:#EAF3DE;color:#3B6D11;}
.bb-cresc{background:#E6F1FB;color:#185FA5;}
.bb-excel{background:#FFF3E0;color:#E65100;}
.therm-wrap{height:20px;background:var(--color-background-tertiary);border-radius:10px;overflow:hidden;margin:8px 0;}
.therm-fill{height:20px;border-radius:10px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:500;color:#fff;transition:width .5s;}
/* COMPRAS */
.semana-card{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:12px;margin-bottom:8px;border-left:3px solid var(--color-border-secondary);}
.semana-ok{border-left-color:#639922;}
.semana-warn{border-left-color:#EF9F27;}
.semana-bad{border-left-color:#E24B4A;}
.semana-neutro{border-left-color:#378ADD;}
.compra-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px;gap:8px;}
.compra-row:last-child{border-bottom:none;}
.termometro{height:14px;background:var(--color-background-tertiary);border-radius:7px;overflow:hidden;margin-top:4px;}
.termo-f{height:14px;border-radius:7px;transition:width .4s;}

.evo-mes-card{background:var(--bg2);border-radius:var(--rl);padding:12px;margin-bottom:8px;border:0.5px solid var(--border);}

/* LOGIN */
.login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.login-box{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:28px;width:100%;max-width:360px;}
.login-brand{text-align:center;margin-bottom:24px;}
.login-brand .lb{font-size:22px;font-weight:500;}
.login-brand .ls{font-size:12px;color:var(--txt3);margin-top:4px;}
.login-err{background:var(--rbg);color:var(--rtxt);border-radius:var(--r);padding:8px 12px;font-size:12px;margin-bottom:12px;display:none;}

/* EXPORT BTN GROUP */
.exp-group{display:flex;gap:5px;flex-wrap:wrap;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <div class="lb">CCD Prime ERP</div>
      <div class="ls">Casa do Curativo</div>
    </div>
    <div id="login-err" class="login-err">Usuário ou senha incorretos.</div>
    <div class="field"><label>Usuário</label><input class="fi" id="l-user" placeholder="Seu nome" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>Senha</label><div style="position:relative">
      <input class="fi" type="password" id="l-pass" placeholder="Sua senha" onkeydown="if(event.key==='Enter')doLogin()" style="padding-right:44px">
      <button onclick="const i=document.getElementById('l-pass');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;color:var(--txt3)">mostrar</button>
    </div></div>
    <button class="btn btn-p btn-full" style="margin-top:4px" onclick="doLogin()">Entrar</button>
    <div style="margin-top:16px;padding-top:14px;border-top:0.5px solid var(--border)">
      <div style="font-size:11px;color:var(--txt3);margin-bottom:8px;text-align:center">Problemas para entrar? O Admin pode resetar os usuários.</div>
      <button class="btn btn-full" style="font-size:11px" onclick="resetarUsuarios()">Resetar usuários para o padrão</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="shell" id="app" style="display:none">
  <div class="topbar">
    <div><div class="brand">CCD Prime ERP</div><div class="brand-sub">Casa do Curativo · Firebase</div></div>

      <div id="spill" class="pill p-sy"><span class="pdot"></span><span id="stxt">Conectando...</span></div>

      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard" onclick="goTab('dashboard',this)">Dashboard</button>
    <button class="tab" data-tab="pdv" onclick="goTab('pdv',this)">PDV</button>
    <button class="tab" data-tab="estoque" onclick="goTab('estoque',this)">Estoque</button>
    <button class="tab" data-tab="produtos" onclick="goTab('produtos',this)">Produtos</button>
    <button class="tab" data-tab="vendedores" onclick="goTab('vendedores',this)">Vendedores</button>
    <button class="tab" data-tab="clientes" onclick="goTab('clientes',this)">Clientes</button>
    <button class="tab" data-tab="fornecedores" onclick="goTab('fornecedores',this)">Fornecedores</button>
    <button class="tab" data-tab="financeiro" onclick="goTab('financeiro',this)">Financeiro</button>
    <button class="tab" data-tab="contas" onclick="goTab('contas',this)">Contas a Pagar</button>
    <button class="tab" data-tab="vendas" onclick="goTab('vendas',this)">Vendas</button>
    <button class="tab" data-tab="metas" onclick="goTab('metas',this)">Metas</button>
    <button class="tab" data-tab="evolucao" onclick="goTab('evolucao',this)">Evolução</button>
    <button class="tab" data-tab="usuarios" onclick="goTab('usuarios',this)">Usuários</button>
    <button class="tab" data-tab="bonificacao" onclick="goTab('bonificacao',this)">🏆 Metas & Bônus</button>
    <button class="tab" data-tab="compras" onclick="goTab('compras',this)">🛒 Compras</button>

  <div class="content">

    <div class="sec" id="sec-pdv"></div>
    <div class="sec" id="sec-estoque"></div>
    <div class="sec" id="sec-produtos"></div>
    <div class="sec" id="sec-vendedores"></div>
    <div class="sec" id="sec-clientes"></div>
    <div class="sec" id="sec-fornecedores"></div>
    <div class="sec" id="sec-financeiro"></div>
    <div class="sec" id="sec-contas"></div>
    <div class="sec" id="sec-vendas"></div>
    <div class="sec" id="sec-metas"></div>
    <div class="sec" id="sec-evolucao"></div>
    <div class="sec" id="sec-usuarios"></div>
    <div class="sec" id="sec-bonificacao"></div>
    <div class="sec" id="sec-compras"></div>
  </div>
</div>
<div id="modal-wrap" style="display:none"></div>

function exportExcel(dados,nomeArquivo,colunas){
  const ws=XLSX.utils.json_to_sheet(dados,{header:colunas.map(c=>c.k)});
  ws['!cols']=colunas.map(c=>({wch:c.w||18}));
  const cabRow={};colunas.forEach(c=>{cabRow[c.k]=c.l;});
  XLSX.utils.sheet_add_json(ws,[cabRow],{skipHeader:true,origin:0});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,nomeArquivo.slice(0,31));
  XLSX.writeFile(wb,nomeArquivo+".xlsx");
}

function acCli(q){const ac=document.getElementById("cli-ac");if(!ac)return;if(q.length<1){ac.style.display="none";return;}const l=[...new Set(DB.vendas.map(v=>v.cliente))].filter(c=>c.toLowerCase().includes(q.toLowerCase()));if(!l.length){ac.style.display="none";return;}ac.innerHTML=l.slice(0,5).map(c=>`<div style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--border)" onmousedown="pCli='${c.replace(/'/g,"\\'")}';document.getElementById('pcli').value='${c.replace(/'/g,"\\'")}';document.getElementById('cli-ac').style.display='none'">${c}</div>`).join("");ac.style.display="block";}
function acProd(q){const ac=document.getElementById("prod-ac");pBusca=q;if(!ac)return;if(q.length<1){ac.style.display="none";return;}const l=DB.produtos.filter(p=>p.nome.toLowerCase().includes(q.toLowerCase())&&p.estoque>0);if(!l.length){ac.style.display="none";return;}ac.innerHTML=l.slice(0,7).map(p=>`<div style="padding:8px 11px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--border)" onmousedown="selProd(${p.id})">${p.nome} <span style="font-size:10px;color:var(--txt3)">${BRL(p.venda)} (${p.estoque} un.)</span></div>`).join("");ac.style.display="block";}
function selProd(id){pId=id;const p=DB.produtos.find(x=>x.id===id);pBusca=p?p.nome:"";const ac=document.getElementById("prod-ac");if(ac)ac.style.display="none";const inp=document.getElementById("pbusca");if(inp)inp.value=pBusca;atualizarTot();rerender();}
function limparProd(){pId="";pBusca="";rerender();}
function atualizarTot(){
  const ps=DB.produtos.find(p=>p.id===pId);
  const qtd=parseFloat(document.getElementById("pqtd")?.value)||0;
  const desc=parseFloat(document.getElementById("pdesc")?.value)||0;
  const t=ps?+(ps.venda*qtd*(1-desc/100)).toFixed(2):0;
  const l=ps?+((ps.venda*(1-desc/100)-ps.compra)*qtd).toFixed(2):0;
  const tv=document.getElementById("tot-v");const lv=document.getElementById("luc-v");
  if(tv)tv.textContent=BRL(t);
  if(lv){
    lv.textContent=l<0?"⚠ "+BRL(l):BRL(l);
    lv.style.color=l<0?"var(--rtxt)":"var(--gtxt)";
  }
}
async function finalizarVenda(){
  const cli=document.getElementById("pcli")?.value.trim()||pCli.trim();
  const ps=DB.produtos.find(p=>p.id===pId);
  const qtd=parseFloat(document.getElementById("pqtd")?.value)||0;
  const desc=parseFloat(document.getElementById("pdesc")?.value)||0;
  const dataV=inputParaData(document.getElementById("pdata")?.value)||pData||hoje();
  if(!cli||!ps||!pVend){alert("Preencha cliente, produto e vendedor.");return;}
  if(qtd<1){alert("Quantidade deve ser maior que zero.");return;}
  const tot=+(ps.venda*qtd*(1-desc/100)).toFixed(2);
  const luc=+((ps.venda*(1-desc/100)-ps.compra)*qtd).toFixed(2);
  if(editVendaId){
    const ant=DB.vendas.find(v=>v.id===editVendaId);
    if(ant)DB.produtos=DB.produtos.map(p=>p.id===ant.produtoId?{...p,estoque:p.estoque+ant.qtd}:p);
    DB.vendas=DB.vendas.map(v=>v.id===editVendaId?{...v,cliente:cli,produto:ps.nome,produtoId:ps.id,qtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:dataV}:v);
    DB.produtos=DB.produtos.map(p=>p.id===ps.id?{...p,estoque:Math.max(0,p.estoque-qtd)}:p);
    editVendaId=null;
  }else{
    DB.vendas.push({id:DB.nextVendaId++,cliente:cli,produto:ps.nome,produtoId:ps.id,qtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:dataV});
    DB.produtos=DB.produtos.map(p=>p.id===ps.id?{...p,estoque:Math.max(0,p.estoque-qtd)}:p);
  }
  pCli="";pId="";pQtd="1";pDesc="0";pBusca="";pOK=true;
  await salvar();rerender();setTimeout(()=>{pOK=false;rerender();},2500);
}

async function salvarEdicaoPedido(){
  const d=mD;
  if(!d.produto||!(+d.qtd>0)||!(+d.valor>0)){alert("Produto, quantidade e valor são obrigatórios.");return;}
  const anterior=DB.pedidos.find(x=>x.id===d.id);
  // Se mudou para recebido, atualiza estoque
  if(anterior&&anterior.status!=="recebido"&&d.status==="recebido"){
    const prod=DB.produtos.find(x=>x.nome.toLowerCase()===d.produto.toLowerCase());
    if(prod)DB.produtos=DB.produtos.map(x=>x.id===prod.id?{...x,estoque:x.estoque+(+d.qtd)}:x);
    pedidoParaCompra({...d,valor:+d.valor,qtd:+d.qtd});
  }
  // Atualiza o valor/descricao no compras também se já existir
  if(DB.compras){
    DB.compras=DB.compras.map(x=>x.pedidoId===d.id?{...x,descricao:d.produto,valor:+d.valor,fornecedor:d.fornecedor||x.fornecedor}:x);
  }
  DB.pedidos=DB.pedidos.map(x=>x.id===d.id?{...d,qtd:+d.qtd,valor:+d.valor}:x);
  fecharModal();await salvar();rerender();
}

async function deletarPedido(id){
  if(!confirm("Remover este pedido?"))return;
  DB.pedidos=(DB.pedidos||[]).filter(x=>x.id!==id);

  await salvar();rerender();
}

function pedidoParaCompra(p){
  if(!DB.compras)DB.compras=[];
  const jaExiste=DB.compras.find(x=>x.pedidoId===p.id);
  if(jaExiste)return;
  const d=new Date();
  const dia=d.getDate();
  const sem=dia<=7?1:dia<=14?2:dia<=21?3:4;
  DB.compras.push({
    id:Date.now()+(Math.random()*1000|0),
    pedidoId:p.id,
    fornecedor:p.fornecedor||"",
    descricao:p.produto||"",
    valor:+p.valor||0,
    categoria:"Produtos A",
    semana:sem,
    data:p.data||hoje(),
    dataiso:new Date().toISOString()
  });
}

// -- EVOLUCAO --
function rEvo(el){
  const hist=[...(DB.historico||[])].sort((a,b)=>a.ano+a.mes>b.ano+b.mes?1:-1);
  const totalFat=hist.reduce((a,h)=>a+h.fat,0);
  const media=hist.length?totalFat/hist.length:0;
  const melhor=hist.length?hist.reduce((a,h)=>h.fat>a.fat?h:a,hist[0]):{fat:0,mes:"01",ano:"2026"};
  const pior=hist.length?hist.reduce((a,h)=>h.fat<a.fat?h:a,hist[0]):{fat:0};
  const ultimo=hist[hist.length-1];const pen=hist.length>1?hist[hist.length-2]:null;
  const delta=pen&&pen.fat>0?((ultimo.fat-pen.fat)/pen.fat*100):0;
  const maxFat=Math.max(...hist.map(h=>h.fat),1);
  const barras=hist.map(h=>{const pct=Math.round((h.fat/maxFat)*100);const cor=h.fat===melhor.fat?"#378ADD":h.fat===pior.fat?"#D4537E":"#7BAFD4";const nm=MESES[parseInt(h.mes)-1]?.slice(0,3)||h.mes;return `<div class="evo-bar-col"><div class="evo-bar-val">${BRL(h.fat).replace("R$ ","")}</div><div style="flex:1;width:100%;display:flex;align-items:flex-end"><div class="evo-bar" style="height:${pct}%;background:${cor};width:100%"></div></div><div class="evo-bar-lbl">${nm}<br>${h.ano}</div></div>`;}).join("");
  el.innerHTML=`
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="kl">Total acumulado</div><div class="kv" style="font-size:14px">${BRL(totalFat)}</div><div class="kd" style="color:var(--txt3)">${hist.length} meses</div></div>
    <div class="kpi"><div class="kl">Media mensal</div><div class="kv" style="font-size:14px">${BRL(media)}</div></div>
    <div class="kpi"><div class="kl">Melhor mes</div><div class="kv" style="font-size:12px;color:var(--gtxt)">${BRL(melhor.fat)}</div><div class="kd" style="color:var(--txt3)">${MESES[parseInt(melhor.mes||1)-1]} ${melhor.ano}</div></div>
    <div class="kpi"><div class="kl">Ultimo vs anterior</div><div class="kv" style="font-size:15px;color:var(--${delta>=0?"g":"r"}txt)">${delta>=0?"+":""}${delta.toFixed(1)}%</div></div>
  </div>
  <div class="card">
    <div class="chd"><div class="ct">Evolucao do faturamento</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="abrirMEvo(null)">+ Adicionar mes</button>
        <div class="exp-group"><button class="btn btn-i btn-sm" onclick="exportEvolucaoExcel()">Excel</button><button class="btn btn-i btn-sm" onclick="exportEvolucaoPDF()">PDF</button></div>
      </div>
    </div>
    <div class="evo-bar-wrap">${barras}</div>
  </div>
  <div class="card"><div class="ct" style="margin-bottom:10px">Historico detalhado</div>
    ${[...hist].reverse().map((h,i,arr)=>{const ant=arr[i+1];const d2=ant&&ant.fat>0?((h.fat-ant.fat)/ant.fat*100):null;const nm=MESES[parseInt(h.mes)-1];return `<div class="evo-mes-card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div><div style="font-size:13px;font-weight:500">${nm} ${h.ano}</div>${h.nota?`<div style="font-size:10px;color:var(--txt3)">${h.nota}</div>`:""}</div><div style="display:flex;align-items:center;gap:6px">${d2!==null?`<span style="font-size:11px;padding:2px 7px;border-radius:100px;font-weight:500;background:var(--${d2>=0?"g":"r"}bg);color:var(--${d2>=0?"g":"r"}txt)">${d2>=0?"+":""}${d2.toFixed(1)}% vs ant.</span>`:`<span style="font-size:11px;color:var(--txt3)">1 mes</span>`}<button class="btn btn-sm" onclick="abrirMEvo('${h.id}')">Editar</button><button class="btn btn-d btn-sm" onclick="delEvo('${h.id}')">Remover</button></div></div><div style="font-size:18px;font-weight:500">${BRL(h.fat)}</div></div>`;}).join("")}
  </div>`;
}
function abrirMEvo(id){
  const h=id?(DB.historico||[]).find(x=>x.id===id):null;
  mD=h?{...h}:{mes:"",ano:new Date().getFullYear().toString(),fat:"",vendas:"",lucro:"",nota:"",id:null};
  abrirModal(`<div class="mtitle">${id?"Editar mes":"Adicionar mes"}<button class="btn btn-sm" onclick="fecharModal()">X</button></div>
    <div class="f2">
      <div class="field"><label>Mes</label><select class="fi" id="evo-mes">${MESES.map((n,i)=>`<option value="${String(i+1).padStart(2,"0")}"${String(i+1).padStart(2,"0")===(mD.mes||"")?" selected":""}>${n}</option>`).join("")}</select></div>

      <div class="field"><label>Lucro (R$)</label><input class="fi" type="number" step="0.01" id="evo-luc" value="${mD.lucro||""}"></div>
      <div class="field fc"><label>Observacao</label><input class="fi" id="evo-nota" value="${mD.nota||""}"></div>
    </div>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarEvo('${id||""}')">Salvar</button></div>`);
}
async function salvarEvo(id){
  const mes=document.getElementById("evo-mes").value;const ano=document.getElementById("evo-ano").value;const fat=parseFloat(document.getElementById("evo-fat").value)||0;
  if(!mes||!ano||!fat){alert("Mes, ano e faturamento obrigatorios.");return;}
  if(!DB.historico)DB.historico=[];
  const key=ano+"-"+mes;
  const entry={id:key,mes,ano,fat,vendas:parseInt(document.getElementById("evo-vend").value)||0,lucro:parseFloat(document.getElementById("evo-luc").value)||0,nota:document.getElementById("evo-nota").value,manual:true};
  const idx=DB.historico.findIndex(h=>h.id===key);
  if(idx>=0)DB.historico[idx]=entry;else DB.historico.push(entry);
  fecharModal();await salvar();rerender();
}
async function delEvo(id){if(!confirm("Remover mes?"))return;if(DB.historico)DB.historico=DB.historico.filter(h=>h.id!==id);await salvar();rerender();}

function calcNivel(fat){
  if(fat>=12000)return 2;
  if(fat>=10000)return 1;
  if(fat>=8500)return 0;
  return -1;
}

function rCompras(el){
  if(!DB.compras)DB.compras=[];
  const mesAtual=new Date().toISOString().slice(0,7);
  const comprasMes=DB.compras.filter(c=>{
    const di=c.dataiso||"";const ds=c.data||"";
    return di.slice(0,7)===mesAtual||ds.slice(6,10)+"-"+ds.slice(3,5)===mesAtual;
  });
  const LMES=2000,LSEM=500;
  const gastoMes=comprasMes.reduce((a,c)=>a+(c.valor||0),0);
  const semAtual=getSemanaAtual();
  const gastoSem=[1,2,3,4].map(s=>comprasMes.filter(c=>c.semana===s).reduce((a,c)=>a+(c.valor||0),0));
  const pctMes=Math.min(100,Math.round((gastoMes/LMES)*100));
  const corMes=pctMes>=100?"#E24B4A":pctMes>=80?"#EF9F27":"#639922";
  const porCat=comprasMes.reduce((acc,c)=>{const k=c.categoria||"Outros";acc[k]=(acc[k]||0)+(c.valor||0);return acc;},{});
  el.innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="kl">Limite mensal</div><div class="kv">${BRL(LMES)}</div><div class="kd info">Teto de compras</div></div>
    <div class="kpi"><div class="kl">Gasto no mes</div><div class="kv" style="color:${corMes}">${BRL(gastoMes)}</div><div class="kd" style="color:${corMes}">${pctMes}% do limite</div></div>
    <div class="kpi"><div class="kl">Saldo disponivel</div><div class="kv ok">${BRL(Math.max(0,LMES-gastoMes))}</div><div class="kd ok">Restante no mes</div></div>
    <div class="kpi"><div class="kl">Semana atual</div><div class="kv info">Sem. ${semAtual}</div><div class="kd info">Gasto: ${BRL(gastoSem[semAtual-1])}</div></div>
  </div>
  <div class="card">
    <div class="ct">Termometro mensal — limite R$ 2.000</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px">
      <span style="color:var(--color-text-tertiary)">R$ 0</span>
      <span style="color:#EF9F27;font-weight:500">Atencao R$ 1.600</span>
      <span style="color:#E24B4A;font-weight:500">Limite R$ 2.000</span>
    </div>
    <div class="termometro" style="height:18px"><div class="termo-f" style="width:${pctMes}%;background:${corMes};display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:500">${pctMes>15?pctMes+"%":""}</div></div>
    <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--color-text-tertiary)">
      <span>Gasto: ${BRL(gastoMes)}</span>
      <span style="color:${corMes};font-weight:500">${pctMes<80?"Seguro":pctMes<100?"ATENCAO — quase no limite":"LIMITE ATINGIDO"}</span>
      <span>Saldo: ${BRL(Math.max(0,LMES-gastoMes))}</span>
    </div>
  </div>
  <div class="card">
    <div class="ct">Controle semanal</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px">
      ${[1,2,3,4].map(s=>{
        const g=gastoSem[s-1];const pct=Math.min(100,Math.round((g/LSEM)*100));
        const cor=pct>=100?"#E24B4A":pct>=80?"#EF9F27":"#639922";
        const atual=s===semAtual;
        return `<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:11px;border:${atual?"1.5px solid #378ADD":"0.5px solid var(--color-border-tertiary)"}">
          <div style="font-size:11px;font-weight:500;color:${atual?"#185FA5":"var(--color-text-tertiary)"};margin-bottom:3px">Semana ${s}${atual?" (atual)":""}</div>
          <div style="font-size:18px;font-weight:500;color:${cor};margin-bottom:4px">${BRL(g)}</div>
          <div class="termometro"><div class="termo-f" style="width:${pct}%;background:${cor}"></div></div>
          <div style="font-size:10px;color:${cor};margin-top:3px">${pct}% de ${BRL(LSEM)}</div>
        </div>`;
      }).join("")}
    </div>
  </div>
  <div class="card">
    <div class="chd"><div class="ct">Compras registradas — ${new Date().toLocaleString("pt-BR",{month:"long",year:"numeric"})}</div>
      <button class="btn btn-p btn-sm" onclick="abrirMCompra()">+ Registrar compra</button>
    </div>
    ${comprasMes.length===0?`<div style="font-size:13px;color:var(--color-text-tertiary);padding:8px 0">Nenhuma compra registrada este mes.</div>`:""}
    ${[...comprasMes].reverse().map(c=>{
      const cor=c.categoria==="Produtos A"?"bg":c.categoria==="Produtos B"?"bi":"bw";
      return `<div class="compra-row">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500">${c.fornecedor}</div>
          <div style="font-size:11px;color:var(--color-text-tertiary)">${c.descricao?c.descricao+" · ":""}Semana ${c.semana} · ${c.data}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          ${bdg(cor,c.categoria||"Outros")}
          <span style="font-weight:500">${BRL(c.valor)}</span>
          <button class="btn btn-d btn-sm" onclick="delCompra(${c.id})">🗑</button>
        </div>
      </div>`;
    }).join("")}
    ${Object.keys(porCat).length>0?`<div style="margin-top:10px;padding:10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md)"><div style="font-size:12px;font-weight:500;margin-bottom:6px">Por categoria</div>${Object.entries(porCat).map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span style="color:var(--color-text-secondary)">${k}</span><span style="font-weight:500">${BRL(v)}</span></div>`).join("")}</div>`:""}
  </div>`;
}

function abrirMCompra(){
  if(!DB.compras)DB.compras=[];
  const sem=getSemanaAtual();
  const mesAtual=new Date().toISOString().slice(0,7);
  const gastoMes=DB.compras.filter(c=>{const di=c.dataiso||"";const ds=c.data||"";return di.slice(0,7)===mesAtual||ds.slice(6,10)+"-"+ds.slice(3,5)===mesAtual;}).reduce((a,c)=>a+(c.valor||0),0);
  mD={fornecedor:"",descricao:"",valor:"",categoria:"Produtos A",semana:sem,data:hoje(),id:null};
  abrirModal(`<div class="mtitle">Registrar compra<button class="btn btn-sm" onclick="fecharModal()">X</button></div>
    <div class="field"><label>Fornecedor *</label><input class="fi" placeholder="Ex: Hospmed, Growth..." oninput="mD.fornecedor=this.value"></div>
    <div class="field"><label>Descricao</label><input class="fi" placeholder="Ex: Curativo prata, PHMB..." oninput="mD.descricao=this.value"></div>
    <div class="f2">
      <div class="field"><label>Valor (R$) *</label><input class="fi" type="number" step="0.01" placeholder="0.00" id="cv-val" oninput="mD.valor=this.value;atualizarPreviewCompra(${gastoMes})"></div>
      <div class="field"><label>Semana</label><select class="fi" onchange="mD.semana=parseInt(this.value)">${[1,2,3,4].map(s=>`<option value="${s}"${s===sem?" selected":""}>Semana ${s}</option>`).join("")}</select></div>
      <div class="field fc"><label>Categoria</label><select class="fi" onchange="mD.categoria=this.value">${["Produtos A","Produtos B","Produtos C","Outros"].map(cat=>`<option>${cat}</option>`).join("")}</select></div>
    </div>
    <div id="compra-preview" style="display:none;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px;font-size:12px;margin-bottom:10px"></div>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarCompra()">Registrar</button></div>`);
}

function atualizarPreviewCompra(gastoJa){
  const v=parseFloat(document.getElementById("cv-val")?.value)||0;
  const p=document.getElementById("compra-preview");
  if(!p||!v)return;
  const novo=gastoJa+v;const saldo=2000-novo;
  const cor=saldo<0?"#A32D2D":saldo<400?"#854F0B":"#3B6D11";
  p.style.display="block";
  p.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:var(--color-text-secondary)">Ja gasto no mes</span><span>${BRL(gastoJa)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:var(--color-text-secondary)">Esta compra</span><span>+ ${BRL(v)}</span></div><div style="display:flex;justify-content:space-between;font-weight:500"><span>Saldo restante</span><span style="color:${cor}">${saldo>=0?BRL(saldo):"EXCEDE o limite em "+BRL(Math.abs(saldo))}</span></div>`;
}

async function salvarCompra(){
  const d=mD;
  if(!d.fornecedor||!(+d.valor>0)){alert("Fornecedor e valor sao obrigatorios.");return;}
  if(!DB.compras)DB.compras=[];
  const mesAtual=new Date().toISOString().slice(0,7);
  const gastoMes=DB.compras.filter(c=>{const di=c.dataiso||"";const ds=c.data||"";return di.slice(0,7)===mesAtual||ds.slice(6,10)+"-"+ds.slice(3,5)===mesAtual;}).reduce((a,c)=>a+(c.valor||0),0);
  if(gastoMes+(+d.valor)>2000){
    if(!confirm(`Esta compra ultrapassa o limite de R$ 2.000! Total: ${BRL(gastoMes+(+d.valor))}.\nDeseja registrar mesmo assim?`))return;
  }
  const co={...d,valor:+d.valor,id:Date.now(),dataiso:new Date().toISOString()};
  DB.compras.push(co);
  fecharModal();await salvar();rerender();
}

async function delCompra(id){
  if(!confirm("Remover lancamento?"))return;
  DB.compras=(DB.compras||[]).filter(c=>c.id!==id);
  await salvar();rerender();
}


// ── FILTROS MENSAIS ──
function vendasDoMes(mes,ano){
  var m=mes||String(new Date().getMonth()+1).padStart(2,"0");
  var a=ano||String(new Date().getFullYear());
  return (DB.vendas||[]).filter(function(v){
    if(!v.data)return false;
    var p=v.data.split("/");
    if(p.length!==3)return false;
    return p[1].padStart(2,"0")===m&&p[2]===a;
  });
}
function mesAtualStr(){
  return new Date().toLocaleString("pt-BR",{month:"long",year:"numeric"});
}
function mesAtualKey(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function arquivarMesSeNecessario(){
  var key=mesAtualKey();
  if(!DB.historico)DB.historico=[];
  var vMes=vendasDoMes();
  var fat=vMes.reduce(function(a,v){return a+v.valor;},0);
  if(!fat)return;
  var mes=String(new Date().getMonth()+1).padStart(2,"0");
  var ano=String(new Date().getFullYear());
  var luc=vMes.reduce(function(a,v){return a+v.lucro;},0);
  var ticket=vMes.length?fat/vMes.length:0;
  var existente=DB.historico.find(function(h){return h.id===key;});
  if(existente&&!existente.manual){existente.fat=fat;existente.lucro=luc;existente.vendas=vMes.length;existente.ticket=ticket;}
  else if(!existente){DB.historico.push({id:key,mes:mes,ano:ano,fat:fat,lucro:luc,vendas:vMes.length,ticket:ticket,nota:"Auto",manual:false});}
}
