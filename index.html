<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CCD Prime Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#e8e8e6;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#9ca3af;--bor:rgba(0,0,0,0.1);--bor2:rgba(0,0,0,0.18);--gbg:#eaf3de;--gtxt:#3b6d11;--rbg:#fcebeb;--rtxt:#a32d2d;--wbg:#faeeda;--wtxt:#854f0b;--ibg:#e6f1fb;--itxt:#185fa5;--blue:#378ADD;--r:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--bor:rgba(255,255,255,0.1);--bor2:rgba(255,255,255,0.2);--gbg:#173404;--gtxt:#97c459;--rbg:#501313;--rtxt:#f09595;--wbg:#412402;--wtxt:#fac775;--ibg:#042c53;--itxt:#85b7eb;}}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
.wrap{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:0.5px solid var(--bor);flex-shrink:0;}
.brand{font-size:14px;font-weight:600;}.brand-sub{font-size:10px;color:var(--txt3);}
.top-right{display:flex;align-items:center;gap:8px;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:100px;font-weight:500;}
.p-ok{background:var(--gbg);color:var(--gtxt);}.p-sy{background:var(--wbg);color:var(--wtxt);}.p-er{background:var(--rbg);color:var(--rtxt);}
.pdot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.user-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:var(--r);background:var(--bg2);cursor:pointer;border:0.5px solid var(--bor);}
.tabs{display:flex;overflow-x:auto;border-bottom:0.5px solid var(--bor);flex-shrink:0;background:var(--bg);}
.tabs::-webkit-scrollbar{height:0;}
.tab{flex-shrink:0;padding:9px 12px;font-size:12px;color:var(--txt2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.tab.hidden{display:none;}
.content{flex:1;padding:12px;overflow-y:auto;}
.sec{display:none;}.sec.active{display:block;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border-radius:var(--r);padding:11px;}
.kl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.kv{font-size:19px;font-weight:500;line-height:1.1;}.kd{font-size:10px;margin-top:2px;}
.ok{color:var(--gtxt);}.warn{color:var(--wtxt);}.bad{color:var(--rtxt);}.info{color:var(--itxt);}
.card{background:var(--bg);border:0.5px solid var(--bor);border-radius:var(--rl);padding:12px 14px;margin-bottom:10px;}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.ct{font-size:13px;font-weight:500;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:0.5px solid var(--bor);}
.mrow:last-child{border-bottom:none;}.ml{color:var(--txt2);}.mv{font-weight:500;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;font-size:10px;font-weight:500;color:var(--txt3);text-transform:uppercase;padding-bottom:6px;border-bottom:0.5px solid var(--bor);}
td{padding:7px 0;border-bottom:0.5px solid var(--bor);color:var(--txt2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}td.b{color:var(--txt);font-weight:500;}
.badge{display:inline-flex;font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}
.bg{background:var(--gbg);color:var(--gtxt);}.br{background:var(--rbg);color:var(--rtxt);}
.bw{background:var(--wbg);color:var(--wtxt);}.bi{background:var(--ibg);color:var(--itxt);}.bgr{background:var(--bg2);color:var(--txt2);}
.btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:var(--r);border:0.5px solid var(--bor2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.btn:hover{background:var(--bg2);}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-s{background:var(--gbg);color:var(--gtxt);border-color:transparent;}
.btn-d{background:var(--rbg);color:var(--rtxt);border-color:transparent;}
.btn-w{background:var(--wbg);color:var(--wtxt);border-color:transparent;}
.btn-sm{padding:3px 8px;font-size:11px;}.btn-full{width:100%;justify-content:center;padding:9px;}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
.field label{font-size:11px;color:var(--txt3);}
.fi{font-size:13px;padding:7px 9px;border:0.5px solid var(--bor2);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;width:100%;}
.fi:focus{border-color:var(--blue);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fc{grid-column:1/-1;}
.prog{height:5px;background:var(--bg3);border-radius:3px;margin-top:4px;}
.pf{height:5px;border-radius:3px;}
.therm{height:16px;background:var(--bg3);border-radius:8px;overflow:hidden;margin:5px 0;}
.therm-f{height:16px;border-radius:8px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:500;color:#fff;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;}
.modal-box{background:var(--bg);border:0.5px solid var(--bor2);border-radius:var(--rl);padding:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.mtitle{font-size:14px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.vcard{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border-radius:var(--rl);padding:10px;margin-bottom:8px;}
.av{width:34px;height:34px;border-radius:50%;background:var(--ibg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--itxt);flex-shrink:0;}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:0.5px solid var(--bor2);border-radius:var(--r);z-index:50;max-height:160px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.ac-item{padding:7px 10px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--bor);}
.ac-item:last-child{border-bottom:none;}.ac-item:hover{background:var(--bg2);}
.evo-wrap{display:flex;align-items:flex-end;gap:5px;height:130px;margin:10px 0 4px;}
.evo-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;}
.evo-bar{width:100%;border-radius:5px 5px 0 0;min-height:3px;}
.evo-lbl{font-size:9px;color:var(--txt3);text-align:center;}
.evo-val{font-size:9px;font-weight:500;color:var(--txt2);text-align:center;}
.forn-card{background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.compra-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid var(--bor);gap:8px;}
.compra-row:last-child{border-bottom:none;}
.ie{width:56px;font-size:12px;padding:3px 6px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;}
.login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.login-box{background:var(--bg);border:0.5px solid var(--bor2);border-radius:var(--rl);padding:28px;width:100%;max-width:340px;}
.login-brand{text-align:center;margin-bottom:22px;}
.lb{font-size:22px;font-weight:600;color:var(--blue);}.ls{font-size:11px;color:var(--txt3);margin-top:3px;}
.login-err{background:var(--rbg);color:var(--rtxt);border-radius:var(--r);padding:8px 11px;font-size:12px;margin-bottom:10px;display:none;}
.notif{background:var(--ibg);color:var(--itxt);font-size:11px;padding:5px 14px;text-align:center;flex-shrink:0;display:none;}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-brand"><div class="lb">CCD Prime</div><div class="ls">Casa do Curativo — Sistema Premium</div></div>
    <div id="login-err" class="login-err">Usuario ou senha incorretos.</div>
    <div class="field"><label>Usuario</label><input class="fi" id="l-user" placeholder="Seu nome"></div>
    <div class="field"><label>Senha</label><input class="fi" type="password" id="l-pass" placeholder="Sua senha"></div>
    <button class="btn btn-p btn-full" id="btn-entrar" style="margin-top:6px">Entrar</button>
    <div style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--bor);text-align:center">
      <button class="btn btn-full" style="font-size:11px" id="btn-reset">Resetar senhas para o padrao</button>
    </div>
  </div>
</div>
<!-- APP -->
<div class="wrap" id="app" style="display:none">
  <div class="topbar">
    <div><div class="brand">CCD Prime Premium</div><div class="brand-sub">Casa do Curativo</div></div>
    <div class="top-right">
      <div id="spill" class="pill p-sy"><span class="pdot"></span><span id="stxt">Conectando...</span></div>
      <button class="btn btn-sm" onclick="backupHD()">Backup</button>
      <div class="user-btn" id="user-btn"><span id="user-name">-</span><span style="font-size:10px;color:var(--txt3)">sair</span></div>
    </div>
  </div>
  <div id="notif-bar" class="notif"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard" onclick="goTab('dashboard',this)">Dashboard</button>
    <button class="tab" data-tab="pdv" onclick="goTab('pdv',this)">PDV</button>
    <button class="tab" data-tab="estoque" onclick="goTab('estoque',this)">Estoque</button>
    <button class="tab" data-tab="produtos" onclick="goTab('produtos',this)">Produtos</button>
    <button class="tab" data-tab="vendedores" onclick="goTab('vendedores',this)">Vendedores</button>
    <button class="tab" data-tab="clientes" onclick="goTab('clientes',this)">Clientes</button>
    <button class="tab" data-tab="fornecedores" onclick="goTab('fornecedores',this)">Fornecedores</button>
    <button class="tab" data-tab="financeiro" onclick="goTab('financeiro',this)">Financeiro</button>
    <button class="tab" data-tab="contas" onclick="goTab('contas',this)">Contas a Pagar</button>
    <button class="tab" data-tab="vendas" onclick="goTab('vendas',this)">Vendas</button>
    <button class="tab" data-tab="metas" onclick="goTab('metas',this)">Metas</button>
    <button class="tab" data-tab="evolucao" onclick="goTab('evolucao',this)">Evolucao</button>
    <button class="tab" data-tab="bonus" onclick="goTab('bonus',this)">Bonus</button>
    <button class="tab" data-tab="compras" onclick="goTab('compras',this)">Compras</button>
    <button class="tab" data-tab="usuarios" onclick="goTab('usuarios',this)">Usuarios</button>
    <button class="tab" data-tab="config" onclick="goTab('config',this)">Config</button>
  </div>
  <div class="content">
    <div class="sec active" id="sec-dashboard"></div>
    <div class="sec" id="sec-pdv"></div>
    <div class="sec" id="sec-estoque"></div>
    <div class="sec" id="sec-produtos"></div>
    <div class="sec" id="sec-vendedores"></div>
    <div class="sec" id="sec-clientes"></div>
    <div class="sec" id="sec-fornecedores"></div>
    <div class="sec" id="sec-financeiro"></div>
    <div class="sec" id="sec-contas"></div>
    <div class="sec" id="sec-vendas"></div>
    <div class="sec" id="sec-metas"></div>
    <div class="sec" id="sec-evolucao"></div>
    <div class="sec" id="sec-bonus"></div>
    <div class="sec" id="sec-compras"></div>
    <div class="sec" id="sec-usuarios"></div>
    <div class="sec" id="sec-config"></div>
  </div>
</div>
<div id="modal-wrap" style="display:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ── DADOS ──
var FB="https://ccd-prime-erp-default-rtdb.firebaseio.com/ccd.json";
var CATS=["CURATIVO","PRODUTO HOSPITALAR","SUPLEMENTACAO","DECREINA"];
var PAGS=["PIX","Cartao credito","Cartao debito","Dinheiro","Crediario"];
var MESES=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var ROLES={admin:"Admin",gerente:"Gerente",vendedor:"Vendedor"};
var NIVEIS=[{label:"Meta Base",valor:8500,bonus:0,cor:"#639922"},{label:"Crescimento",valor:10000,bonus:150,cor:"#378ADD"},{label:"Excelencia",valor:12000,bonus:300,cor:"#FF9800"}];
var USERS_DEF=[{id:1,nome:"Admin",senha:"ccd2026",role:"admin",ativo:true},{id:2,nome:"Raylene",senha:"casa01",role:"vendedor",ativo:true},{id:3,nome:"Adriel",senha:"casa02",role:"vendedor",ativo:true}];
var PRODS_DEF=[
  {id:1,nome:"Curativo de prata",familia:"CURATIVO",compra:17.58,venda:80,estoque:180},
  {id:2,nome:"Alginato de calcio",familia:"CURATIVO",compra:5.42,venda:50,estoque:190},
  {id:3,nome:"Espuma",familia:"CURATIVO",compra:8.97,venda:80,estoque:30},
  {id:4,nome:"Hidrogel",familia:"CURATIVO",compra:12.07,venda:70,estoque:42},
  {id:5,nome:"Hidrofibra",familia:"CURATIVO",compra:13.75,venda:80,estoque:110},
  {id:6,nome:"Sol. PHMB",familia:"CURATIVO",compra:51.47,venda:130,estoque:11},
  {id:7,nome:"Spray barreira",familia:"CURATIVO",compra:27.77,venda:65,estoque:35},
  {id:8,nome:"Creme barreira",familia:"CURATIVO",compra:35.67,venda:90,estoque:8},
  {id:9,nome:"Generacell",familia:"CURATIVO",compra:82.9,venda:124.35,estoque:4},
  {id:10,nome:"Oleo girassol",familia:"CURATIVO",compra:2.97,venda:12,estoque:40},
  {id:11,nome:"Algodao 500g",familia:"PRODUTO HOSPITALAR",compra:14.49,venda:21.9,estoque:3},
  {id:12,nome:"SF 0,9%",familia:"PRODUTO HOSPITALAR",compra:4,venda:5,estoque:21},
  {id:13,nome:"Filme Transparente",familia:"PRODUTO HOSPITALAR",compra:56,venda:130,estoque:3},
  {id:14,nome:"Fralda G/EG",familia:"PRODUTO HOSPITALAR",compra:33.99,venda:60,estoque:3},
  {id:15,nome:"Bolsa colostomia",familia:"PRODUTO HOSPITALAR",compra:12,venda:22,estoque:37},
  {id:16,nome:"Seringa 5ml",familia:"PRODUTO HOSPITALAR",compra:0.33,venda:1,estoque:76},
  {id:17,nome:"Aparelho pressao",familia:"PRODUTO HOSPITALAR",compra:109,venda:149,estoque:1},
  {id:18,nome:"Whey",familia:"SUPLEMENTACAO",compra:53.22,venda:95,estoque:12},
  {id:19,nome:"SOY Whey",familia:"SUPLEMENTACAO",compra:99.88,venda:150,estoque:8},
  {id:20,nome:"Arginina",familia:"SUPLEMENTACAO",compra:66.55,venda:100,estoque:4},
  {id:21,nome:"Colageno",familia:"SUPLEMENTACAO",compra:22.11,venda:40,estoque:6},
  {id:22,nome:"Vit. C",familia:"SUPLEMENTACAO",compra:18.77,venda:35,estoque:20},
  {id:23,nome:"Gotas Decreina",familia:"DECREINA",compra:42,venda:85,estoque:4},
  {id:24,nome:"Queratolitico",familia:"DECREINA",compra:40,venda:80,estoque:5}
];
var DEF={
  produtos:PRODS_DEF,
  vendedores:[{id:1,nome:"Raylene",meta:30000,ativo:true},{id:2,nome:"Adriel",meta:25000,ativo:true}],
  vendas:[],historico:[
    {id:"2026-01",mes:"01",ano:"2026",fat:8301.10,lucro:0,vendas:0,ticket:0,nota:"Janeiro 2026"},
    {id:"2026-02",mes:"02",ano:"2026",fat:5080.20,lucro:0,vendas:0,ticket:0,nota:"Fevereiro 2026"},
    {id:"2026-03",mes:"03",ano:"2026",fat:8758.60,lucro:0,vendas:0,ticket:0,nota:"Marco 2026"},
    {id:"2026-04",mes:"04",ano:"2026",fat:8600.00,lucro:0,vendas:0,ticket:0,nota:"Abril 2026"}
  ],
  fornecedores:[],pedidos:[],contas:[],compras:[],usuarios:USERS_DEF,
  metas:{faturamento:10000,lucro:43000,ticket:200,clientes:60,bonus_cresc:150,bonus_excel:300,bonus_ticket:80,ticket_min:230},
  nextPId:100,nextVId:10,nextVendaId:1,nextContaId:1,nextFornId:1,nextPedId:1,nextCompraId:1
};
var DB=JSON.parse(JSON.stringify(DEF));
var secao="dashboard",mD={},usuarioAtual=null,saving=false;
var pId="",pQtd="1",pDesc="0",pPag="PIX",pVend="",pCli="",pBusca="",pData="",pOK=false,editVId=null;
var estF="Todos",estB="",prodB="",ieId=null,ieVal=0;

// ── UTILS ──
function BRL(v){return "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(v){return Number(v).toFixed(1)+"%";}
function mg(c,v){return v>0?Math.round(((v-c)/v)*100):0;}
function hoje(){return new Date().toLocaleDateString("pt-BR");}
function toArr(v){if(!v)return [];if(Array.isArray(v))return v;return Object.values(v);}
function bdg(t,tx){return '<span class="badge '+t+'">'+tx+'</span>';}
function isAdmin(){return usuarioAtual&&usuarioAtual.role==="admin";}
function isAdm(){return usuarioAtual&&(usuarioAtual.role==="admin"||usuarioAtual.role==="gerente");}
function dataParaInput(d){if(!d)return new Date().toISOString().split("T")[0];var p=d.split("/");if(p.length===3)return p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");return d;}
function inputParaData(d){if(!d)return hoje();var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function diasVencer(v){if(!v)return 999;var h=new Date();h.setHours(0,0,0,0);var p=v.split("/");var d=new Date(+p[2],+p[1]-1,+p[0]);return Math.round((d-h)/86400000);}
function mesKey(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function mesStr(){return new Date().toLocaleString("pt-BR",{month:"long",year:"numeric"});}
function getSem(){var d=new Date().getDate();return d<=7?1:d<=14?2:d<=21?3:4;}
function vendasMes(mes,ano){
  var m=mes||String(new Date().getMonth()+1).padStart(2,"0");
  var a=ano||String(new Date().getFullYear());
  return toArr(DB.vendas).filter(function(v){if(!v.data)return false;var p=v.data.split("/");return p.length===3&&p[1].padStart(2,"0")===m&&p[2]===a;});
}

// ── FIREBASE ──
function setStat(cls,txt){var p=document.getElementById("spill");if(p){p.className="pill "+cls;document.getElementById("stxt").textContent=txt;}}
async function fbGet(){var r=await fetch(FB,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json();}
async function fbSet(d){var r=await fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status);}
function mergeDB(d){
  var r=JSON.parse(JSON.stringify(DEF));
  ["produtos","vendedores","vendas","historico","fornecedores","pedidos","contas","compras","usuarios"].forEach(function(k){if(d[k]&&toArr(d[k]).length>0)r[k]=toArr(d[k]);});
  if(d.metas)r.metas=Object.assign({},r.metas,d.metas);
  ["nextPId","nextVId","nextVendaId","nextContaId","nextFornId","nextPedId","nextCompraId"].forEach(function(k){if(d[k])r[k]=d[k];});
  return r;
}
async function carregar(){
  setStat("p-sy","Conectando...");
  try{var d=await fbGet();if(d)DB=mergeDB(d);setStat("p-ok","Sincronizado");}
  catch(e){try{var loc=localStorage.getItem("ccd_db");if(loc){DB=mergeDB(JSON.parse(loc));}}catch(e2){}setStat("p-er","Offline");}
  rerender();
  setInterval(async function(){try{var d=await fbGet();if(d){var n=mergeDB(d);if(JSON.stringify(n)!==JSON.stringify(DB)){DB=n;setStat("p-ok","Atualizado");rerender();}}}catch(e){}},15000);
}
var saveCount=0;
async function salvar(){
  if(saving)return;saving=true;setStat("p-sy","Salvando...");
  try{await fbSet(DB);setStat("p-ok","Salvo");}catch(e){setStat("p-er","Firebase offline");}
  try{localStorage.setItem("ccd_db",JSON.stringify(DB));}catch(e){}
  saving=false;
  saveCount++;
  if(saveCount%10===0)autoBackupHD();
}

// ── BACKUP HD ──
function autoBackupHD(){
  try{
    var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    var dt=new Date();a.download="ccd_auto_"+dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
    localStorage.setItem("ccd_last_backup",Date.now());
    notif("Backup automatico salvo no HD: "+a.download,"g");
  }catch(e){}
}
function backupHD(){
  try{
    var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="ccd_backup_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
    localStorage.setItem("ccd_last_backup",Date.now());
    notif("Backup salvo! Guarde na pasta CCD Backups do seu notebook.","g");
  }catch(e){}
}
function notif(msg,tipo){
  var el=document.getElementById("notif-bar");if(!el)return;
  el.style.background=tipo==="g"?"var(--gbg)":tipo==="w"?"var(--wbg)":"var(--ibg)";
  el.style.color=tipo==="g"?"var(--gtxt)":tipo==="w"?"var(--wtxt)":"var(--itxt)";
  el.textContent=msg;el.style.display="block";
  setTimeout(function(){el.style.display="none";},5000);
}

// ── LOGIN ──
function doLogin(){
  var nome=document.getElementById("l-user").value.trim();
  var senha=document.getElementById("l-pass").value;
  var err=document.getElementById("login-err");
  if(!nome||!senha){err.style.display="block";err.textContent="Preencha usuario e senha.";return;}
  var users=toArr(DB.usuarios).length?toArr(DB.usuarios):USERS_DEF;
  var user=null;
  for(var i=0;i<users.length;i++){if(users[i].nome.toLowerCase()===nome.toLowerCase()&&users[i].senha===senha&&users[i].ativo){user=users[i];break;}}
  if(!user){err.style.display="block";err.textContent="Usuario ou senha incorretos.";return;}
  err.style.display="none";usuarioAtual=user;
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("user-name").textContent=user.nome+" ("+(ROLES[user.role]||user.role)+")";
  document.getElementById("user-btn").onclick=function(){if(confirm("Deseja sair?"))location.reload();};
  aplicarPermissoes();carregar();
}

function aplicarPermissoes(){
  var restritas=["financeiro","evolucao","contas","fornecedores","bonus","compras","usuarios","config"];
  document.querySelectorAll(".tab").forEach(function(t){
    var tab=t.getAttribute("data-tab");
    if(usuarioAtual.role==="vendedor"&&restritas.indexOf(tab)>=0)t.classList.add("hidden");
    else t.classList.remove("hidden");
  });
}

// ── NAV ──
function goTab(id,el){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  if(el)el.classList.add("active");
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("active");});
  var sec=document.getElementById("sec-"+id);if(sec)sec.classList.add("active");
  secao=id;rerender();
}
function rerender(){render(secao);}
function render(id){
  var el=document.getElementById("sec-"+id);if(!el)return;
  var map={dashboard:rDash,pdv:rPDV,estoque:rEst,produtos:rProd,vendedores:rVend,clientes:rCli,fornecedores:rForn,financeiro:rFin,contas:rContas,vendas:rVendas,metas:rMetas,evolucao:rEvo,bonus:rBonus,compras:rCompras,usuarios:rUsers,config:rConfig};
  if(map[id])map[id](el);
}

function acCli(q){var ac=document.getElementById("cli-ac");if(!ac)return;if(q.length<1){ac.style.display="none";return;}var seen={},l=[];toArr(DB.vendas).forEach(function(v){if(!seen[v.cliente]&&v.cliente.toLowerCase().indexOf(q.toLowerCase())>=0){seen[v.cliente]=1;l.push(v.cliente);}});if(!l.length){ac.style.display="none";return;}ac.innerHTML=l.slice(0,5).map(function(c){return '<div class="ac-item" onmousedown="selCli(\''+c.replace(/'/g,"&#39;")+'\')">'+c+'</div>';}).join("");ac.style.display="block";}
function selCli(n){pCli=n;var i=document.getElementById("pcli");if(i)i.value=n;var ac=document.getElementById("cli-ac");if(ac)ac.style.display="none";}
function acProd(q){pBusca=q;pId="";var ac=document.getElementById("prod-ac");if(!ac)return;if(q.length<1){ac.style.display="none";return;}var l=toArr(DB.produtos).filter(function(p){return p.nome.toLowerCase().indexOf(q.toLowerCase())>=0&&p.estoque>0;});if(!l.length){ac.style.display="none";return;}ac.innerHTML=l.slice(0,6).map(function(p){return '<div style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--bor)" onmousedown="selProd('+p.id+')">'+p.nome+' <span style="font-size:10px;color:var(--txt3)">'+BRL(p.venda)+' ('+p.estoque+' un.)</span></div>';}).join("");ac.style.display="block";}
function selProd(id){pId=id;var p=toArr(DB.produtos).find(function(x){return x.id===id;});pBusca=p?p.nome:"";var inp=document.getElementById("pbusca");if(inp)inp.value=pBusca;var ac=document.getElementById("prod-ac");if(ac)ac.style.display="none";atuTot();rerender();}
function limparProd(){pId="";pBusca="";rerender();}
function atuTot(){
  var ps=toArr(DB.produtos).find(function(p){return p.id===pId;});
  var qtd=parseFloat((document.getElementById("pqtd")||{}).value||pQtd)||0;
  var desc=parseFloat((document.getElementById("pdesc")||{}).value||pDesc)||0;
  var t=ps?+((ps.venda*qtd*(1-desc/100)).toFixed(2)):0;
  var l=ps?+(((ps.venda*(1-desc/100)-ps.compra)*qtd).toFixed(2)):0;
  var tv=document.getElementById("tot-v");if(tv)tv.textContent=BRL(t);
  var lv=document.getElementById("luc-v");if(lv){lv.textContent=(l<0?"(-) ":"")+BRL(Math.abs(l));lv.style.color=l>=0?"var(--gtxt)":"var(--rtxt)";}
}
async function finVenda(){
  var cliEl=document.getElementById("pcli");
  var cli=(cliEl?cliEl.value:pCli).trim();
  var ps=toArr(DB.produtos).find(function(p){return p.id===pId;});
  var qtd=parseFloat((document.getElementById("pqtd")||{}).value||pQtd)||0;
  var desc=parseFloat((document.getElementById("pdesc")||{}).value||pDesc)||0;
  var dEl=document.getElementById("pdata");var dataV=dEl?inputParaData(dEl.value):(pData||hoje());
  if(!cli||!ps||!pVend){alert("Preencha cliente, produto e vendedor.");return;}
  if(qtd<1){alert("Quantidade minima e 1.");return;}
  var tot=+((ps.venda*qtd*(1-desc/100)).toFixed(2));
  var luc=+(((ps.venda*(1-desc/100)-ps.compra)*qtd).toFixed(2));
  if(!DB.vendas)DB.vendas=[];
  if(editVId){
    var ant=DB.vendas.find(function(v){return v.id===editVId;});
    if(ant)DB.produtos=DB.produtos.map(function(p){return p.id===ant.produtoId?Object.assign({},p,{estoque:p.estoque+ant.qtd}):p;});
    DB.vendas=DB.vendas.map(function(v){return v.id===editVId?Object.assign({},v,{cliente:cli,produto:ps.nome,produtoId:ps.id,qtd:qtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:dataV}):v;});
    DB.produtos=DB.produtos.map(function(p){return p.id===ps.id?Object.assign({},p,{estoque:Math.max(0,p.estoque-qtd)}):p;});
    editVId=null;
  }else{
    DB.vendas.push({id:DB.nextVendaId++,cliente:cli,produto:ps.nome,produtoId:ps.id,qtd:qtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:dataV});
    DB.produtos=DB.produtos.map(function(p){return p.id===ps.id?Object.assign({},p,{estoque:Math.max(0,p.estoque-qtd)}):p;});
  }
  pCli="";pId="";pQtd="1";pDesc="0";pBusca="";pOK=true;
  await salvar();rerender();
  setTimeout(function(){pOK=false;rerender();},2500);
}
function cancelarEd(){editVId=null;pCli="";pId="";pQtd="1";pDesc="0";pBusca="";rerender();}

function rEst(el){

  var val=toArr(DB.produtos).reduce(function(a,p){return a+p.compra*p.estoque;},0);
  var zero=toArr(DB.produtos).filter(function(p){return p.estoque===0;}).length;

// ── CLIENTES ──
function rCli(el){
  var clis={};toArr(DB.vendas).forEach(function(v){if(!clis[v.cliente])clis[v.cliente]={nome:v.cliente,n:0,fat:0,comps:[]};clis[v.cliente].n++;clis[v.cliente].fat+=v.valor;clis[v.cliente].comps.push(v);});
  var lista=Object.values(clis).sort(function(a,b){return b.fat-a.fat;});
  var fat=toArr(DB.vendas).reduce(function(a,v){return a+v.valor;},0);
  var tk=toArr(DB.vendas).length?fat/toArr(DB.vendas).length:0;
  var html='<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="kl">Clientes unicos</div><div class="kv">'+lista.length+'</div></div><div class="kpi"><div class="kl">Total vendas</div><div class="kv">'+toArr(DB.vendas).length+'</div></div><div class="kpi"><div class="kl">Ticket medio</div><div class="kv" style="font-size:14px">'+BRL(tk)+'</div></div></div>';
  html+='<div class="card"><div class="ct" style="margin-bottom:10px">Historico por cliente</div>';
  html+='<input class="fi" style="margin-bottom:10px" id="cli-busca" placeholder="Buscar cliente..." oninput="filtrarCli(this.value)">';
  lista.forEach(function(c){
    var ini=c.nome.split(" ").map(function(n){return n[0];}).slice(0,2).join("");
    var sid=c.nome.replace(/[^a-zA-Z0-9]/g,"_");
    html+='<div class="cli-row" data-nome="'+c.nome.toLowerCase()+'" style="margin-bottom:8px;border:0.5px solid var(--bor);border-radius:var(--rl);overflow:hidden">';
    html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);cursor:pointer" onclick="toggleCli(\'c_'+sid+'\')">';
    html+='<div class="av" style="width:30px;height:30px;font-size:11px">'+ini+'</div>';
    html+='<div style="flex:1"><div style="font-size:13px;font-weight:500">'+c.nome+'</div><div style="font-size:11px;color:var(--txt3)">'+c.n+' compra(s) — '+BRL(c.fat)+'</div></div><span style="font-size:11px;color:var(--txt3)">▼</span></div>';
    html+='<div id="c_'+sid+'" style="display:none;padding:10px 12px"><table><thead><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Valor</th><th>Pagto</th></tr></thead><tbody>';
    c.comps.slice().reverse().forEach(function(v){html+='<tr><td style="color:var(--txt3)">'+v.data+'</td><td class="b">'+v.produto+'</td><td>'+v.qtd+'</td><td class="b">'+BRL(v.valor)+'</td><td>'+bdg("bi",v.pagamento)+'</td></tr>';});
    html+='</tbody></table></div></div>';
  });
  if(!lista.length)html+='<div style="font-size:13px;color:var(--txt3);padding:8px">Nenhum cliente ainda.</div>';
  html+='</div>';el.innerHTML=html;
}
function toggleCli(id){var e=document.getElementById(id);if(e)e.style.display=e.style.display==="none"?"block":"none";}
function filtrarCli(q){document.querySelectorAll(".cli-row").forEach(function(r){r.style.display=(r.getAttribute("data-nome")||"").indexOf(q.toLowerCase())>=0?"":"none";});}

function rForn(el){

  html+='<div class="card"><div class="chd"><div class="ct">Fornecedores</div><button class="btn btn-p btn-sm" onclick="abrirMForn(null)">+ Novo</button></div>';
  if(!fns.length)html+='<div style="font-size:13px;color:var(--txt3);padding:8px">Nenhum fornecedor cadastrado.</div>';
  fns.forEach(function(f){
    var fps=peds.filter(function(p){return p.fornecedorId===f.id;});

    html+='<div class="forn-card"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div style="flex:1"><div style="font-size:13px;font-weight:500;margin-bottom:2px">'+f.nome+'</div>';
    if(f.telefone)html+='<div style="font-size:11px;color:var(--txt3)">'+f.telefone+'</div>';
    if(f.condicoes)html+='<div style="font-size:11px;color:var(--txt2);margin-top:2px">'+f.condicoes+'</div>';
    html+='<div style="font-size:11px;color:var(--gtxt);margin-top:4px">'+fps.length+' pedido(s) — Total: '+BRL(totalG)+'</div></div>';
    html+='<div style="display:flex;gap:4px;flex-shrink:0"><button class="btn btn-p btn-sm" onclick="abrirMPed('+f.id+')">+ Pedido</button><button class="btn btn-sm" onclick="abrirMForn('+f.id+')">Editar</button><button class="btn btn-d btn-sm" onclick="delForn('+f.id+')">Del</button></div></div>';
    if(fps.length){
      html+='<div style="margin-top:10px;border-top:0.5px solid var(--bor);padding-top:8px">';
      fps.slice().reverse().forEach(function(p){
        var cor=p.status==="recebido"?"bg":p.status==="em transito"?"bi":"bw";
        var dias=p.vencimento?diasVencer(p.vencimento):null;
        var dStr=dias!==null?(dias<0?"<span style='color:var(--rtxt);font-weight:500'>Vencido "+Math.abs(dias)+"d</span>":dias===0?"<span style='color:var(--rtxt)'>Hoje</span>":"<span style='color:var(--wtxt)'>"+dias+"d</span>"):"";
        html+='<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:0.5px solid var(--bor)"><div><b>'+p.produto+'</b> — '+BRL(p.valor)+(p.vencimento?" — Vence: "+p.vencimento+" "+dStr:"")+'</div>';
        html+='<div style="display:flex;align-items:center;gap:5px">'+bdg(cor,p.status);
        if(p.status!=="recebido")html+='<button class="btn btn-s btn-sm" onclick="receberPed('+p.id+')">Receber</button>';
        html+='<button class="btn btn-sm" onclick="editarPed('+p.id+')">Editar</button><button class="btn btn-d btn-sm" onclick="delPed('+p.id+')">Del</button></div></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';el.innerHTML=html;
}
function abrirMForn(id){

async function salvarForn(){var d=mD;if(!d.nome){alert("Nome obrigatorio.");return;}if(!DB.fornecedores)DB.fornecedores=[];var f=Object.assign({},d);if(f.id)DB.fornecedores=DB.fornecedores.map(function(x){return x.id===f.id?f:x;});else{f.id=DB.nextFornId++;DB.fornecedores.push(f);}fecharModal();await salvar();rerender();}
async function delForn(id){if(!confirm("Remover fornecedor?"))return;DB.fornecedores=DB.fornecedores.filter(function(f){return f.id!==id;});await salvar();rerender();}
function pedParaCompra(p){if(!DB.compras)DB.compras=[];if(toArr(DB.compras).find(function(x){return x.pedidoId===p.id;}))return;DB.compras.push({id:Date.now()+(Math.random()*999|0),pedidoId:p.id,fornecedor:p.fornecedor||"",descricao:p.produto||"",valor:+p.valor||0,semana:getSem(),data:p.data||hoje(),dataiso:new Date().toISOString()});}
function abrirMPed(fornId){
  var f=toArr(DB.fornecedores).find(function(x){return x.id===fornId;});
  mD={fornecedorId:fornId,fornecedor:f?f.nome:"",produto:"",valor:"",vencimento:"",data:hoje(),status:"aguardando",id:null};
  var h='<div class="mtitle">Novo pedido — '+(f?f.nome:"")+'<button class="btn btn-sm" onclick="fecharModal()">X</button></div>';
  h+='<div class="f2"><div class="field fc"><label>Produto/descricao *</label><input class="fi" oninput="mD.produto=this.value"></div>';
  h+='<div class="field"><label>Valor total (R$) *</label><input class="fi" type="number" step="0.01" oninput="mD.valor=this.value"></div>';
  h+='<div class="field"><label>Vencimento boleto</label><input class="fi" type="date" onchange="mD.vencimento=inputParaData(this.value)"></div>';
  h+='<div class="field"><label>Data do pedido</label><input class="fi" type="date" value="'+dataParaInput(hoje())+'" onchange="mD.data=inputParaData(this.value)"></div>';
  h+='<div class="field fc"><label>Status</label><select class="fi" onchange="mD.status=this.value"><option value="aguardando">Aguardando</option><option value="em transito">Em transito</option><option value="recebido">Recebido</option></select></div></div>';
  h+='<div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarPed()">Registrar</button></div>';
  abrirModal(h);
}
function editarPed(id){
  var p=toArr(DB.pedidos).find(function(x){return x.id===id;});if(!p)return;
  mD=JSON.parse(JSON.stringify(p));
  var h='<div class="mtitle">Editar pedido<button class="btn btn-sm" onclick="fecharModal()">X</button></div>';
  h+='<div class="f2"><div class="field fc"><label>Produto *</label><input class="fi" value="'+(p.produto||"")+'" oninput="mD.produto=this.value"></div>';

  h+='<div class="field"><label>Vencimento boleto</label><input class="fi" type="date" value="'+dataParaInput(p.vencimento)+'" onchange="mD.vencimento=inputParaData(this.value)"></div>';
  h+='<div class="field"><label>Data pedido</label><input class="fi" type="date" value="'+dataParaInput(p.data||hoje())+'" onchange="mD.data=inputParaData(this.value)"></div>';
  h+='<div class="field fc"><label>Status</label><select class="fi" onchange="mD.status=this.value"><option value="aguardando"'+(p.status==="aguardando"?" selected":"")+'>Aguardando</option><option value="em transito"'+(p.status==="em transito"?" selected":"")+'>Em transito</option><option value="recebido"'+(p.status==="recebido"?" selected":"")+'>Recebido</option></select></div></div>';
  h+='<div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarEdPed()">Salvar</button></div>';
  abrirModal(h);

function abrirMUser(id){var users=toArr(DB.usuarios).length?toArr(DB.usuarios):USERS_DEF;mD=id?Object.assign({},users.find(function(u){return u.id===id;})||{}):{nome:"",senha:"",role:"vendedor",ativo:true,id:null};var h='<div class="mtitle">'+(id?"Editar":"Novo usuario")+'<button class="btn btn-sm" onclick="fecharModal()">X</button></div>';h+='<div class="field"><label>Nome *</label><input class="fi" value="'+(mD.nome||"")+'" oninput="mD.nome=this.value"></div>';h+='<div class="field"><label>Senha *</label><input class="fi" type="password" value="'+(mD.senha||"")+'" oninput="mD.senha=this.value"></div>';h+='<div class="field"><label>Nivel</label><select class="fi" onchange="mD.role=this.value">';Object.entries(ROLES).forEach(function(e){h+='<option value="'+e[0]+'"'+(e[0]===(mD.role||"vendedor")?" selected":"")+'>'+e[1]+'</option>';});h+='</select></div>';h+='<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:12px"><input type="checkbox" '+(mD.ativo?"checked":"")+' onchange="mD.ativo=this.checked"> Ativo</label>';h+='<div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="salvarUser()">Salvar</button></div>';abrirModal(h);}
async function salvarUser(){var d=mD;if(!d.nome||!d.senha||d.senha.length<4){alert("Nome e senha (min 4 chars) sao obrigatorios.");return;}if(!DB.usuarios)DB.usuarios=JSON.parse(JSON.stringify(USERS_DEF));var u=Object.assign({},d,{ativo:!!d.ativo});if(u.id)DB.usuarios=DB.usuarios.map(function(x){return x.id===u.id?u:x;});else{u.id=Date.now();DB.usuarios.push(u);}fecharModal();await salvar();rerender();}
async function delUser(id){if(!confirm("Remover usuario?"))return;if(!DB.usuarios)DB.usuarios=JSON.parse(JSON.stringify(USERS_DEF));DB.usuarios=DB.usuarios.filter(function(u){return u.id!==id;});await salvar();rerender();}

function importarBackup(){var inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=async function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=async function(ev){try{var d=JSON.parse(ev.target.result);DB=mergeDB(d);await salvar();rerender();alert("Backup restaurado com sucesso!");}catch(err){alert("Erro ao importar: "+err.message);}};reader.readAsText(file);};inp.click();}

function expXLS(dados,nome,cols){if(typeof XLSX==="undefined"){alert("Aguarde o carregamento do sistema.");return;}var ws=XLSX.utils.json_to_sheet(dados,{header:cols.map(function(c){return c.k;})});ws["!cols"]=cols.map(function(c){return {wch:c.w||18};});var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,nome.slice(0,31));XLSX.writeFile(wb,nome+".xlsx");}
function exportVendasXLS(){var d=toArr(DB.vendas).map(function(v){return {Data:v.data,Cliente:v.cliente,Produto:v.produto,Qtd:v.qtd,Valor:v.valor,Lucro:v.lucro,Pagamento:v.pagamento,Vendedor:v.vendedor};});if(!d.length){alert("Sem vendas.");return;}expXLS(d,"CCD_Vendas",[{k:"Data",w:12},{k:"Cliente",w:22},{k:"Produto",w:24},{k:"Qtd",w:8},{k:"Valor",w:14},{k:"Lucro",w:14},{k:"Pagamento",w:16},{k:"Vendedor",w:18}]);}

function exportFinXLS(){var fat=toArr(DB.vendas).reduce(function(a,v){return a+v.valor;},0),luc=toArr(DB.vendas).reduce(function(a,v){return a+v.lucro;},0);expXLS([{Item:"Receita Bruta",Valor:fat},{Item:"CMV",Valor:fat-luc},{Item:"Lucro Bruto",Valor:luc},{Item:"Despesas",Valor:1843},{Item:"Lucro Liquido",Valor:luc-1843}],"CCD_DRE",[{k:"Item",w:28},{k:"Valor",w:18}]);}
function exportEvoXLS(){var d=toArr(DB.historico).map(function(h){return {Mes:MESES[parseInt(h.mes)-1],Ano:h.ano,Faturamento:h.fat,Vendas:h.vendas,Lucro:h.lucro};});if(!d.length){alert("Sem historico.");return;}expXLS(d,"CCD_Evolucao",[{k:"Mes",w:14},{k:"Ano",w:8},{k:"Faturamento",w:18},{k:"Vendas",w:12},{k:"Lucro",w:16}]);}
function expPDF(titulo,corpo){var w=window.open("","_blank");var dt=new Date().toLocaleDateString("pt-BR");w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+titulo+'</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:24px;}h1{font-size:18px;margin-bottom:4px;}p.sub{font-size:11px;color:#777;margin-bottom:20px;}table{width:100%;border-collapse:collapse;}th{background:#378ADD;color:#fff;padding:7px 10px;text-align:left;}td{padding:6px 10px;border-bottom:1px solid #eee;}.ft{margin-top:24px;font-size:10px;color:#aaa;text-align:center;}</style></head><body>');w.document.write('<h1>'+titulo+'</h1><p class="sub">Casa do Curativo — '+dt+' — '+(usuarioAtual?usuarioAtual.nome:"Sistema")+'</p>');w.document.write(corpo);w.document.write('<div class="ft">CCD Prime Premium</div></body></html>');w.document.close();setTimeout(function(){w.print();},400);}

function exportFinPDF(){var fat=toArr(DB.vendas).reduce(function(a,v){return a+v.valor;},0),luc=toArr(DB.vendas).reduce(function(a,v){return a+v.lucro;},0);var rows='<table><thead><tr><th>Item</th><th>Valor</th></tr></thead><tbody>';[["Receita Bruta",fat],["CMV",fat-luc],["Lucro Bruto",luc],["Despesas",1843],["Lucro Liquido",luc-1843]].forEach(function(r){rows+='<tr><td>'+r[0]+'</td><td>R$ '+r[1].toFixed(2)+'</td></tr>';});rows+='</tbody></table>';expPDF("DRE — Demonstrativo de Resultado",rows);}
