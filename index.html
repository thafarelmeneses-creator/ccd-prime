<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCD Prime ERP — Casa do Curativo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#e8e8e6;--txt:#1a1a1a;--txt2:#6b6b6b;--txt3:#9ca3af;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--green-bg:#eaf3de;--green-txt:#3b6d11;--red-bg:#fcebeb;--red-txt:#a32d2d;--warn-bg:#faeeda;--warn-txt:#854f0b;--info-bg:#e6f1fb;--info-txt:#185fa5;--blue:#378ADD;--r:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--txt:#f2f2f7;--txt2:#aeaeb2;--txt3:#636366;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--green-bg:#173404;--green-txt:#97c459;--red-bg:#501313;--red-txt:#f09595;--warn-bg:#412402;--warn-txt:#fac775;--info-bg:#042c53;--info-txt:#85b7eb;}}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--border);background:var(--bg);flex-shrink:0;}
.brand{font-size:15px;font-weight:500;}.brand-sub{font-size:10px;color:var(--txt3);}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:100px;font-weight:500;}
.p-ok{background:var(--green-bg);color:var(--green-txt);}.p-sy{background:var(--warn-bg);color:var(--warn-txt);}.p-er{background:var(--red-bg);color:var(--red-txt);}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.tabs{display:flex;overflow-x:auto;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.tabs::-webkit-scrollbar{height:0;}
.tab{flex-shrink:0;padding:10px 14px;font-size:13px;color:var(--txt2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.content{flex:1;padding:14px;overflow-y:auto;}
.sec{display:none;}.sec.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--bg2);border-radius:var(--r);padding:12px;}
.kl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.kv{font-size:19px;font-weight:500;line-height:1.1;}.kd{font-size:10px;margin-top:3px;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:13px 15px;margin-bottom:10px;}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ct{font-size:13px;font-weight:500;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
th{text-align:left;font-size:10px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding-bottom:7px;border-bottom:0.5px solid var(--border);}
td{padding:7px 0;border-bottom:0.5px solid var(--border);color:var(--txt2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}td.b{color:var(--txt);font-weight:500;}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}
.bg{background:var(--green-bg);color:var(--green-txt);}.br{background:var(--red-bg);color:var(--red-txt);}
.bw{background:var(--warn-bg);color:var(--warn-txt);}.bi{background:var(--info-bg);color:var(--info-txt);}
.bgr{background:var(--bg2);color:var(--txt2);}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.btn:hover{background:var(--bg2);}.btn-p{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-s{background:var(--green-bg);color:var(--green-txt);border-color:transparent;}
.btn-d{background:var(--red-bg);color:var(--red-txt);border-color:transparent;}
.btn-w{background:var(--warn-bg);color:var(--warn-txt);border-color:transparent;}
.btn-sm{padding:4px 9px;font-size:11px;}.btn-full{width:100%;justify-content:center;padding:10px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;}
.field label{font-size:11px;color:var(--txt3);}
.fi{font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;width:100%;}
.fi:focus{border-color:var(--blue);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fc{grid-column:1/-1;}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.mrow:last-child{border-bottom:none;}.ml{color:var(--txt2);}.mv{font-weight:500;}
.prog{height:5px;background:var(--bg3);border-radius:3px;margin-top:4px;}
.pf{height:5px;border-radius:3px;}
.alert{display:flex;align-items:center;gap:7px;font-size:12px;padding:8px 10px;border-radius:var(--r);margin-bottom:6px;}
.ar{background:var(--red-bg);color:var(--red-txt);}.aw{background:var(--warn-bg);color:var(--warn-txt);}
.ai{background:var(--info-bg);color:var(--info-txt);}
.ok-bar{background:var(--green-bg);color:var(--green-txt);border-radius:var(--r);padding:9px 12px;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.tbox{background:var(--bg2);border-radius:var(--r);padding:11px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tl{font-size:10px;color:var(--txt3);}.tv{font-size:19px;font-weight:500;}
.vcard{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;}
.av{width:36px;height:36px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--info-txt);flex-shrink:0;}
.filtros{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.fb{font-size:11px;padding:4px 10px;border-radius:100px;border:0.5px solid var(--border2);background:var(--bg);color:var(--txt2);cursor:pointer;}
.fb.active{background:var(--info-bg);color:var(--info-txt);border-color:var(--blue);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.mtitle{font-size:14px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.ie{width:60px;font-size:12px;padding:3px 6px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;}
.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--r);z-index:50;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.autocomplete-item{padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--border);}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover{background:var(--bg2);}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.rank-item:last-child{border-bottom:none;}
.rank-num{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:13px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-sub{font-size:11px;color:var(--txt3);}
.rank-val{font-size:13px;font-weight:500;color:var(--green-txt);flex-shrink:0;}
.conta-card{background:var(--bg2);border-radius:var(--rl);padding:11px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.conta-info{flex:1;min-width:0;}
.conta-nome{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:3px;}
.conta-meta{font-size:11px;color:var(--txt3);}
.lembrete-badge{font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div><div class="brand">CCD Prime ERP</div><div class="brand-sub">Casa do Curativo · Firebase Sync</div></div>
    <div id="spill" class="pill p-sy"><span class="pdot"></span><span id="stxt">Conectando...</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="goTab('dashboard',this)">Dashboard</button>
    <button class="tab" onclick="goTab('pdv',this)">PDV</button>
    <button class="tab" onclick="goTab('estoque',this)">Estoque</button>
    <button class="tab" onclick="goTab('produtos',this)">Produtos</button>
    <button class="tab" onclick="goTab('vendedores',this)">Vendedores</button>
    <button class="tab" onclick="goTab('clientes',this)">Clientes</button>
    <button class="tab" onclick="goTab('financeiro',this)">Financeiro</button>
    <button class="tab" onclick="goTab('contas',this)">Contas a Pagar</button>
    <button class="tab" onclick="goTab('vendas',this)">Vendas</button>
    <button class="tab" onclick="goTab('metas',this)">Metas</button>
  </div>
  <div class="content">
    <div class="sec active" id="sec-dashboard"></div>
    <div class="sec" id="sec-pdv"></div>
    <div class="sec" id="sec-estoque"></div>
    <div class="sec" id="sec-produtos"></div>
    <div class="sec" id="sec-vendedores"></div>
    <div class="sec" id="sec-clientes"></div>
    <div class="sec" id="sec-financeiro"></div>
    <div class="sec" id="sec-contas"></div>
    <div class="sec" id="sec-vendas"></div>
    <div class="sec" id="sec-metas"></div>
  </div>
</div>
<div id="modal-wrap" style="display:none"></div>
<script>
const FB="https://ccd-prime-erp-default-rtdb.firebaseio.com/ccd.json";
const CATS=["CURATIVO","PRODUTO HOSPITALAR","SUPLEMENTAÇÃO","DECREÍNA"];
const PAGS=["PIX","Cartão crédito","Cartão débito","Dinheiro","Crediário"];
const DEF={
  produtos:[
    {id:1,nome:"Curativo de prata",familia:"CURATIVO",compra:17.58,venda:80,estoque:180},
    {id:2,nome:"Alginato de cálcio",familia:"CURATIVO",compra:5.42,venda:50,estoque:190},
    {id:3,nome:"Espuma",familia:"CURATIVO",compra:8.97,venda:80,estoque:30},
    {id:4,nome:"Hidrogel",familia:"CURATIVO",compra:12.07,venda:70,estoque:42},
    {id:5,nome:"Hidrofibra",familia:"CURATIVO",compra:13.75,venda:80,estoque:110},
    {id:6,nome:"Sol. PHMB",familia:"CURATIVO",compra:51.47,venda:130,estoque:11},
    {id:7,nome:"Spray barreira",familia:"CURATIVO",compra:27.77,venda:65,estoque:35},
    {id:8,nome:"Creme barreira",familia:"CURATIVO",compra:35.67,venda:90,estoque:8},
    {id:9,nome:"Generacell",familia:"CURATIVO",compra:82.9,venda:124.35,estoque:4},
    {id:10,nome:"Óleo girassol",familia:"CURATIVO",compra:2.97,venda:12,estoque:40},
    {id:11,nome:"Algodão 500g",familia:"PRODUTO HOSPITALAR",compra:14.49,venda:21.9,estoque:3},
    {id:12,nome:"SF 0,9%",familia:"PRODUTO HOSPITALAR",compra:4,venda:5,estoque:21},
    {id:13,nome:"Filme Transparente",familia:"PRODUTO HOSPITALAR",compra:56,venda:130,estoque:3},
    {id:14,nome:"Fralda G/EG",familia:"PRODUTO HOSPITALAR",compra:33.99,venda:60,estoque:3},
    {id:15,nome:"Bolsa colostomia",familia:"PRODUTO HOSPITALAR",compra:12,venda:22,estoque:38},
    {id:16,nome:"Seringa 5ml",familia:"PRODUTO HOSPITALAR",compra:0.33,venda:1,estoque:76},
    {id:17,nome:"Aparelho pressão",familia:"PRODUTO HOSPITALAR",compra:109,venda:149,estoque:1},
    {id:18,nome:"Whey",familia:"SUPLEMENTAÇÃO",compra:53.22,venda:95,estoque:12},
    {id:19,nome:"SOY Whey",familia:"SUPLEMENTAÇÃO",compra:99.88,venda:150,estoque:8},
    {id:20,nome:"Arginina",familia:"SUPLEMENTAÇÃO",compra:66.55,venda:100,estoque:4},
    {id:21,nome:"Colageno",familia:"SUPLEMENTAÇÃO",compra:22.11,venda:40,estoque:6},
    {id:22,nome:"Vit. C",familia:"SUPLEMENTAÇÃO",compra:18.77,venda:35,estoque:20},
    {id:23,nome:"Gotas Decreína",familia:"DECREÍNA",compra:42,venda:85,estoque:4},
    {id:24,nome:"Queratolítico",familia:"DECREÍNA",compra:40,venda:80,estoque:5}
  ],
  vendedores:[
    {id:1,nome:"Ana Lima",meta:30000,ativo:true},
    {id:2,nome:"Carlos Reis",meta:25000,ativo:true},
    {id:3,nome:"Maria Silva",meta:35000,ativo:true}
  ],
  vendas:[],
  contas:[],
  metas:{faturamento:144000,lucro:43000,ticket:200,clientes:60},
  nextPId:100,nextVId:10,nextVendaId:1,nextContaId:1
};

let DB=JSON.parse(JSON.stringify(DEF));
let secao="dashboard",modal=null,mD={};
let estF="Todos",estB="",prodB="";
let pId="",pQtd="1",pDesc="0",pPag="PIX",pVend="",pCli="",pOK=false,pData="";
let pBusca="",pFiltrados=[];
let ieId=null,ieVal=0;
let saving=false;
let editVendaId=null;

const BRL=v=>"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const PCT=v=>Number(v).toFixed(1)+"%";
const mg=(c,v)=>v>0?Math.round(((v-c)/v)*100):0;
const hoje=()=>new Date().toLocaleDateString("pt-BR");
const bdg=(t,tx)=>`<span class="badge ${t}">${tx}</span>`;

function setStat(cls,txt){const p=document.getElementById("spill");p.className="pill "+cls;document.getElementById("stxt").textContent=txt;}
async function fbGet(){const r=await fetch(FB);if(!r.ok)throw new Error(r.status);return await r.json();}
async function fbSet(d){const r=await fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status);}
async function carregar(){
  setStat("p-sy","Conectando...");
  try{const d=await fbGet();if(d&&d.produtos)DB={...DEF,...d};else await fbSet(DB);setStat("p-ok","Sincronizado ✓");}
  catch(e){setStat("p-er","Modo offline");}
  rerender();
  setInterval(async()=>{try{const d=await fbGet();if(d&&d.produtos&&JSON.stringify(d)!==JSON.stringify(DB)){DB={...DEF,...d};setStat("p-ok","Atualizado ✓");rerender();}}catch(e){}},10000);
  verificarLembretes();
}
async function salvar(){
  if(saving)return;saving=true;setStat("p-sy","Salvando...");
  try{await fbSet(DB);setStat("p-ok","Salvo ✓");}
  catch(e){setStat("p-er","Erro ao salvar");}
  saving=false;
}
function goTab(id,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  if(el)el.classList.add("active");
  document.querySelectorAll(".sec").forEach(s=>s.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("active");
  secao=id;rerender();
}
function rerender(){render(secao);}
function render(id){
  const el=document.getElementById("sec-"+id);if(!el)return;
  if(id==="dashboard")rDash(el);
  else if(id==="pdv")rPDV(el);
  else if(id==="estoque")rEst(el);
  else if(id==="produtos")rProd(el);
  else if(id==="vendedores")rVend(el);
  else if(id==="clientes")rClientes(el);
  else if(id==="financeiro")rFin(el);
  else if(id==="contas")rContas(el);
  else if(id==="vendas")rVendas(el);
  else if(id==="metas")rMetas(el);
}

// ── DASHBOARD ──
function rDash(el){
  const{produtos,vendas,metas,vendedores}=DB;
  const fat=vendas.reduce((a,v)=>a+v.valor,0);
  const luc=vendas.reduce((a,v)=>a+v.lucro,0);
  const tk=vendas.length?fat/vendas.length:0;
  const zero=produtos.filter(p=>p.estoque===0);
  const crit=produtos.filter(p=>p.estoque>0&&p.estoque<=3);
  const alertas=[...zero.map(p=>({t:"r",m:`${p.nome} — zerado`})),...crit.map(p=>({t:"w",m:`${p.nome} — ${p.estoque} un.`}))];

  // Rankings
  const prodMap={};
  vendas.forEach(v=>{if(!prodMap[v.produto])prodMap[v.produto]={nome:v.produto,qtd:0,fat:0};prodMap[v.produto].qtd+=v.qtd;prodMap[v.produto].fat+=v.valor;});
  const topProd=Object.values(prodMap).sort((a,b)=>b.fat-a.fat).slice(0,5);

  const cliMap={};
  vendas.forEach(v=>{if(!cliMap[v.cliente])cliMap[v.cliente]={nome:v.cliente,compras:0,fat:0};cliMap[v.cliente].compras++;cliMap[v.cliente].fat+=v.valor;});
  const topCli=Object.values(cliMap).sort((a,b)=>b.fat-a.fat).slice(0,5);

  const vendMap={};
  vendas.forEach(v=>{if(!vendMap[v.vendedor])vendMap[v.vendedor]={nome:v.vendedor,qtd:0,fat:0};vendMap[v.vendedor].qtd++;vendMap[v.vendedor].fat+=v.valor;});
  const topVend=Object.values(vendMap).sort((a,b)=>b.fat-a.fat).slice(0,5);

  const contasVenc=DB.contas?DB.contas.filter(c=>!c.paga&&diasParaVencer(c.vencimento)<=3):[];

  el.innerHTML=`
  ${contasVenc.length?`<div class="alert aw" style="margin-bottom:10px">⚠️ ${contasVenc.length} conta(s) vencendo em breve — veja "Contas a Pagar"</div>`:""}
  <div class="kpi-grid">
    <div class="kpi"><div class="kl">Faturamento mês</div><div class="kv">${BRL(fat)}</div><div class="kd" style="color:var(--${fat>=metas.faturamento?"green":"warn"}-txt)">${Math.round((fat/(metas.faturamento||1))*100)}% da meta</div></div>
    <div class="kpi"><div class="kl">Lucro líquido</div><div class="kv">${BRL(luc)}</div><div class="kd" style="color:var(--${luc>=metas.lucro?"green":"warn"}-txt)">${Math.round((luc/(metas.lucro||1))*100)}% da meta</div></div>
    <div class="kpi"><div class="kl">Ticket médio</div><div class="kv">${BRL(tk)}</div></div>
    <div class="kpi"><div class="kl">Vendas</div><div class="kv">${vendas.length}</div><div class="kd" style="color:var(--green-txt)">${vendedores.filter(v=>v.ativo).length} vendedores</div></div>
    <div class="kpi"><div class="kl">Zerados</div><div class="kv" style="color:var(--${zero.length?"red":"green"}-txt)">${zero.length}</div></div>
    <div class="kpi"><div class="kl">Críticos</div><div class="kv" style="color:var(--${crit.length?"warn":"green"}-txt)">${crit.length}</div></div>
  </div>
  <div class="row3">
    <div class="card">
      <div class="ct" style="margin-bottom:10px">🏆 Produtos mais vendidos</div>
      ${topProd.length?topProd.map((p,i)=>`<div class="rank-item"><div class="rank-num">${i+1}</div><div class="rank-info"><div class="rank-name">${p.nome}</div><div class="rank-sub">${p.qtd} un. vendidas</div></div><div class="rank-val">${BRL(p.fat)}</div></div>`).join(""):`<div style="font-size:12px;color:var(--txt3)">Sem vendas ainda</div>`}
    </div>
    <div class="card">
      <div class="ct" style="margin-bottom:10px">👥 Clientes que mais compram</div>
      ${topCli.length?topCli.map((c,i)=>`<div class="rank-item"><div class="rank-num">${i+1}</div><div class="rank-info"><div class="rank-name">${c.nome}</div><div class="rank-sub">${c.compras} compra(s)</div></div><div class="rank-val">${BRL(c.fat)}</div></div>`).join(""):`<div style="font-size:12px;color:var(--txt3)">Sem clientes ainda</div>`}
    </div>
    <div class="card">
      <div class="ct" style="margin-bottom:10px">🥇 Vendedores que mais vendem</div>

// ── PDV ──
function rPDV(el){
  const va=DB.vendedores.filter(v=>v.ativo);
  if(!pVend&&va.length)pVend=va[0].nome;

  const ps=DB.produtos.find(p=>p.id===pId);
  const qtdNum=parseFloat(pQtd)||0;
  const descNum=parseFloat(pDesc)||0;
  const tot=ps?+(ps.venda*qtdNum*(1-descNum/100)).toFixed(2):0;
  const luc=ps?+((ps.venda-ps.compra)*qtdNum*(1-descNum/100)).toFixed(2):0;

  el.innerHTML=`
  ${pOK?`<div class="ok-bar">✓ Venda registrada e sincronizada!</div>`:""}
  <div class="card"><div class="ct" style="margin-bottom:10px">${editVendaId?"✏ Editar venda":"Registrar nova venda"}</div>

    <div class="field">
      <label>Cliente *</label>
      <div class="autocomplete-wrap">
        <input class="fi" id="pcli" placeholder="Nome do cliente" value="${pCli}" oninput="pCli=this.value;atualizarAutocliComplete(this.value)" autocomplete="off">
        <div class="autocomplete-list" id="cli-list" style="display:none"></div>
      </div>
    </div>

    <div class="field">
      <label>Buscar produto *</label>
      <input class="fi" id="pbusca" placeholder="Digite o nome do produto..." value="${pBusca}" oninput="buscarProduto(this.value)" autocomplete="off">
    </div>
    ${pFiltrados.length>0&&!pId?`<div style="background:var(--bg2);border-radius:var(--r);margin-bottom:9px;overflow:hidden;border:0.5px solid var(--border2)">
      ${pFiltrados.slice(0,6).map(p=>`<div style="padding:8px 11px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--border)" onclick="selecionarProduto(${p.id})">${p.nome} — ${BRL(p.venda)} <span style="color:var(--txt3);font-size:11px">(${p.estoque} un.)</span></div>`).join("")}
    </div>`:""}
    ${ps?`<div style="background:var(--info-bg);border-radius:var(--r);padding:9px 11px;font-size:12px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between">
      <span><b style="color:var(--info-txt)">${ps.nome}</b> · Margem <b>${mg(ps.compra,ps.venda)}%</b> · Lucro unit. <b>${BRL(ps.venda-ps.compra)}</b> · Estoque: <b>${ps.estoque}</b></span>
      <button class="btn btn-sm" onclick="limparProduto()" style="font-size:10px">✕ trocar</button>
    </div>`:""}

    <div class="f2">
      <div class="field">
        <label>Quantidade</label>
        <input class="fi" type="number" min="1" id="pqtd" value="${pQtd}" oninput="pQtd=this.value;atualizarTotais()">
      </div>
      <div class="field">
        <label>Desconto %</label>
        <input class="fi" type="number" min="0" max="100" id="pdesc" value="${pDesc}" oninput="pDesc=this.value;atualizarTotais()">
      </div>
      <div class="field">
        <label>Pagamento</label>
        <select class="fi" onchange="pPag=this.value">${PAGS.map(p=>`<option${p===pPag?" selected":""}>${p}</option>`).join("")}</select>
      </div>
      <div class="field">
        <label>Vendedor</label>
        <select class="fi" onchange="pVend=this.value">${va.map(v=>`<option${v.nome===pVend?" selected":""}>${v.nome}</option>`).join("")}</select>
      </div>
      <div class="field fc">
        <label>Data da venda</label>
        <input class="fi" type="date" id="pdata" value="${dataParaInput(pData)}" onchange="pData=inputParaData(this.value)">
      </div>
    </div>

    <div class="tbox" id="totais-box">
      <div><div class="tl">Total</div><div class="tv" id="tot-val">${BRL(tot)}</div></div>
      <div><div class="tl">Lucro estimado</div><div class="tv" style="color:var(--green-txt)" id="luc-val">${BRL(luc)}</div></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-p btn-full" onclick="finalizarVenda()">✓ ${editVendaId?"Salvar edição":"Finalizar venda"}</button>
      ${editVendaId?`<button class="btn btn-sm" onclick="cancelarEdicao()" style="flex-shrink:0">Cancelar</button>`:""}
    </div>
  </div>`;
}

function dataParaInput(d){
  if(!d)return new Date().toISOString().split("T")[0];
  const p=d.split("/");
  if(p.length===3)return `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  return d;
}
function inputParaData(d){
  if(!d)return hoje();
  const p=d.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}

function buscarProduto(q){
  pBusca=q;pId="";
  if(q.length<1){pFiltrados=[];rerender();return;}
  pFiltrados=DB.produtos.filter(p=>p.nome.toLowerCase().includes(q.toLowerCase())&&p.estoque>0);
  rerender();
}
function selecionarProduto(id){
  pId=id;pBusca=DB.produtos.find(p=>p.id===id)?.nome||"";pFiltrados=[];
  atualizarTotais();rerender();
}
function limparProduto(){pId="";pBusca="";pFiltrados=[];rerender();}

function atualizarTotais(){
  const ps=DB.produtos.find(p=>p.id===pId);
  const qtd=parseFloat(document.getElementById("pqtd")?.value)||0;
  const desc=parseFloat(document.getElementById("pdesc")?.value)||0;
  const tot=ps?+(ps.venda*qtd*(1-desc/100)).toFixed(2):0;
  const luc=ps?+((ps.venda-ps.compra)*qtd*(1-desc/100)).toFixed(2):0;
  const tv=document.getElementById("tot-val");
  const lv=document.getElementById("luc-val");
  if(tv)tv.textContent=BRL(tot);
  if(lv)lv.textContent=BRL(luc);
}

function atualizarAutocliComplete(q){
  const list=document.getElementById("cli-list");if(!list)return;
  if(q.length<1){list.style.display="none";return;}
  const clientes=[...new Set(DB.vendas.map(v=>v.cliente))].filter(c=>c.toLowerCase().includes(q.toLowerCase()));
  if(!clientes.length){list.style.display="none";return;}
  list.innerHTML=clientes.slice(0,5).map(c=>`<div class="autocomplete-item" onmousedown="pCli='${c}';document.getElementById('pcli').value='${c}';document.getElementById('cli-list').style.display='none'">${c}</div>`).join("");
  list.style.display="block";
}

async function finalizarVenda(){
  const cli=document.getElementById("pcli")?.value.trim()||pCli.trim();
  const ps=DB.produtos.find(p=>p.id===pId);
  const qtd=parseFloat(document.getElementById("pqtd")?.value)||parseFloat(pQtd)||0;
  const desc=parseFloat(document.getElementById("pdesc")?.value)||0;
  const dataVenda=inputParaData(document.getElementById("pdata")?.value)||pData||hoje();
  if(!cli||!ps||!pVend){alert("Preencha cliente, produto e vendedor.");return;}
  if(qtd<1){alert("Quantidade deve ser maior que zero.");return;}
  const tot=+(ps.venda*qtd*(1-desc/100)).toFixed(2);
  const luc=+((ps.venda-ps.compra)*qtd*(1-desc/100)).toFixed(2);

  if(editVendaId){
    const antiga=DB.vendas.find(v=>v.id===editVendaId);
    if(antiga)DB.produtos=DB.produtos.map(p=>p.id===antiga.produtoId?{...p,estoque:p.estoque+antiga.qtd}:p);
    DB.vendas=DB.vendas.map(v=>v.id===editVendaId?{...v,cliente:cli,produto:ps.nome,produtoId:ps.id,qtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:dataVenda}:v);
    DB.produtos=DB.produtos.map(p=>p.id===ps.id?{...p,estoque:Math.max(0,p.estoque-qtd)}:p);
    editVendaId=null;
  }else{
    DB.vendas.push({id:DB.nextVendaId++,cliente:cli,produto:ps.nome,produtoId:ps.id,qtd,valor:tot,lucro:luc,pagamento:pPag,vendedor:pVend,data:dataVenda});
    DB.produtos=DB.produtos.map(p=>p.id===ps.id?{...p,estoque:Math.max(0,p.estoque-qtd)}:p);
  }
  pCli="";pId="";pQtd="1";pDesc="0";pBusca="";pFiltrados=[];pOK=true;
  await salvar();rerender();
  setTimeout(()=>{pOK=false;rerender();},2500);
}
function cancelarEdicao(){editVendaId=null;pCli="";pId="";pQtd="1";pDesc="0";pBusca="";pFiltrados=[];rerender();}

    ${lista.map(p=>`

function abrirMProd(id){
  mD=id?{...DB.produtos.find(p=>p.id===id)}:{nome:"",familia:CATS[0],compra:"",venda:"",estoque:"",id:null};
  const prev=+mD.compra>0&&+mD.venda>0?`<div style="background:var(--bg2);border-radius:var(--r);padding:8px;font-size:12px;margin-bottom:8px">Lucro: <b>${BRL(+mD.venda-+mD.compra)}</b> · Margem: <b>${mg(+mD.compra,+mD.venda)}%</b></div>`:"";
  document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box">
    <div class="mtitle">${id?"Editar produto":"Novo produto"}<button class="btn btn-sm" onclick="fecharModal()">✕</button></div>
    <div class="f2">
      <div class="field fc"><label>Nome *</label><input class="fi" id="mpn" value="${mD.nome||""}" placeholder="Nome do produto" oninput="mD.nome=this.value"></div>
      <div class="field fc"><label>Categoria</label><select class="fi" onchange="mD.familia=this.value">${CATS.map(c=>`<option${c===(mD.familia||CATS[0])?" selected":""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Preço compra (R$)</label><input class="fi" type="number" step="0.01" value="${mD.compra||""}" placeholder="0.00" oninput="mD.compra=this.value"></div>
      <div class="field"><label>Preço venda (R$)</label><input class="fi" type="number" step="0.01" value="${mD.venda||""}" placeholder="0.00" oninput="mD.venda=this.value"></div>
      <div class="field fc"><label>Estoque</label><input class="fi" type="number" value="${mD.estoque||""}" placeholder="0" oninput="mD.estoque=this.value"></div>
    </div>
    ${prev}
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-p" onclick="salvarProd()">✓ Salvar produto</button>
    </div>
  </div></div>`;
  document.getElementById("modal-wrap").style.display="block";
}
function fecharModal(){document.getElementById("modal-wrap").style.display="none";document.getElementById("modal-wrap").innerHTML="";}
async function salvarProd(){
  const d=mD;
  if(!d.nome||!(+d.venda>0)){alert("Nome e preço de venda obrigatórios.");return;}
  const p={...d,compra:+d.compra||0,venda:+d.venda,estoque:+d.estoque||0};
  if(p.id)DB.produtos=DB.produtos.map(x=>x.id===p.id?p:x);
  else{p.id=DB.nextPId++;DB.produtos.push(p);}
  fecharModal();await salvar();rerender();
}
async function delProd(id){if(!confirm("Remover produto?"))return;DB.produtos=DB.produtos.filter(p=>p.id!==id);await salvar();rerender();}

// ── VENDEDORES ──
function rVend(el){
  el.innerHTML=`<div class="card">
    <div class="chd"><div class="ct">Equipe (${DB.vendedores.length})</div><button class="btn btn-p btn-sm" onclick="abrirMVend(null)">+ Novo vendedor</button></div>

      const vv=DB.vendas.filter(x=>x.vendedor===v.nome);
      const fat=vv.reduce((a,x)=>a+x.valor,0);
      const pct=v.meta>0?(fat/v.meta)*100:0;
      const ini=v.nome.split(" ").map(n=>n[0]).slice(0,2).join("");
      return `<div class="vcard"><div class="av">${ini}</div><div style="flex:1">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-weight:500;font-size:13px">${v.nome}</span>${bdg(v.ativo?"bg":"bgr",v.ativo?"Ativo":"Inativo")}</div>

        <div class="prog"><div class="pf" style="width:${Math.min(100,Math.round(pct))}%;background:${pct>=100?"#639922":"#378ADD"}"></div></div>
        <div style="font-size:10px;color:${pct>=100?"var(--green-txt)":"var(--txt3)"};margin-top:2px">${Math.round(pct)}% da meta</div>
      </div>
      <div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="abrirMVend(${v.id})">✏</button><button class="btn btn-d btn-sm" onclick="delVend(${v.id})">🗑</button></div></div>`;
    }).join("")}
  </div>`;
}
function abrirMVend(id){
  mD=id?{...DB.vendedores.find(v=>v.id===id)}:{nome:"",meta:"",ativo:true,id:null};
  document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box">
    <div class="mtitle">${id?"Editar vendedor":"Novo vendedor"}<button class="btn btn-sm" onclick="fecharModal()">✕</button></div>
    <div class="field"><label>Nome *</label><input class="fi" value="${mD.nome||""}" placeholder="Nome completo" oninput="mD.nome=this.value"></div>
    <div class="field"><label>Meta mensal (R$) *</label><input class="fi" type="number" value="${mD.meta||""}" placeholder="Ex: 30000" oninput="mD.meta=this.value"></div>

    <div style="display:flex;gap:6px;justify-content:flex-end">

      <button class="btn btn-p" onclick="salvarVend()">✓ Salvar</button>
    </div>
  </div></div>`;

}
async function salvarVend(){
  const d=mD;if(!d.nome||!(+d.meta>0)){alert("Nome e meta obrigatórios.");return;}
  const v={...d,meta:+d.meta,ativo:!!d.ativo};
  if(v.id)DB.vendedores=DB.vendedores.map(x=>x.id===v.id?v:x);
  else{v.id=DB.nextVId++;DB.vendedores.push(v);}
  fecharModal();await salvar();rerender();
}
async function delVend(id){if(!confirm("Remover vendedor?"))return;DB.vendedores=DB.vendedores.filter(v=>v.id!==id);await salvar();rerender();}

          <div class="av" style="width:32px;height:32px;font-size:11px">${ini}</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:500">${cli}</div>
            <div style="font-size:11px;color:var(--txt3)">${compras.length} compra(s) · Total: ${BRL(fat)} · Lucro: ${BRL(luc)}</div>
          </div>
          <span style="font-size:11px;color:var(--txt3)">▾</span>
        </div>
        <div id="cli_${cli.replace(/\s/g,'_')}" style="display:none;padding:10px 12px">
          <table><thead><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Valor</th><th>Pagamento</th><th>Vendedor</th></tr></thead><tbody>
          ${[...compras].reverse().map(v=>`<tr><td style="color:var(--txt3)">${v.data}</td><td class="b">${v.produto}</td><td>${v.qtd}</td><td class="b">${BRL(v.valor)}</td><td>${bdg(v.pagamento==="PIX"?"bi":"bgr",v.pagamento)}</td><td>${v.vendedor}</td></tr>`).join("")}
          </tbody></table>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}
function toggleCliente(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==="none"?"block":"none";}

// ── FINANCEIRO ──
function rFin(el){
  const{vendas}=DB;
  const fat=vendas.reduce((a,v)=>a+v.valor,0);
  const luc=vendas.reduce((a,v)=>a+v.lucro,0);
  const cmv=fat-luc;const desp=19800;const ll=luc-desp;const ml=fat>0?(ll/fat)*100:0;
  const porPag=vendas.reduce((acc,v)=>{acc[v.pagamento]=(acc[v.pagamento]||0)+v.valor;return acc;},{});
  el.innerHTML=`
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="kl">Receita bruta</div><div class="kv" style="font-size:14px">${BRL(fat)}</div></div>
    <div class="kpi"><div class="kl">CMV</div><div class="kv" style="font-size:14px">${BRL(cmv)}</div></div>
    <div class="kpi"><div class="kl">Lucro bruto</div><div class="kv" style="font-size:14px">${BRL(luc)}</div><div class="kd" style="color:var(--green-txt)">${PCT(fat>0?(luc/fat)*100:0)}</div></div>
    <div class="kpi"><div class="kl">Lucro líquido</div><div class="kv" style="font-size:14px;color:var(--${ll>=0?"green":"red"}-txt)">${BRL(ll)}</div><div class="kd" style="color:var(--${ll>=0?"green":"red"}-txt)">${PCT(ml)}</div></div>
  </div>
  <div class="row2">
    <div class="card"><div class="ct" style="margin-bottom:8px">DRE</div>
      ${[["Receita bruta",fat,""],["(−) CMV",-cmv,"s"],["(=) Lucro bruto",luc,"ok"],["(−) Despesas",-desp,"s"],["(=) Lucro líquido",ll,ll>=0?"ok":"no"]].map(([l,v,t])=>`
      <div class="mrow" ${t==="ok"||t==="no"?`style="background:var(--${t==="ok"?"green":"red"}-bg);border-radius:var(--r);padding:6px 8px;margin:2px 0"`:""}>
        <span style="font-size:12px;color:var(--${t==="s"?"txt2":"txt"});${t!=="s"?"font-weight:500":""}">${l}</span>
        <span style="font-weight:500;font-size:12px;color:var(--${t==="ok"?"green":t==="no"?"red":"txt"}-txt)">${v<0?"-":"+"}${BRL(Math.abs(v))}</span>
      </div>`).join("")}
    </div>
    <div class="card"><div class="ct" style="margin-bottom:8px">Por forma de pagamento</div>
      ${Object.keys(porPag).length?Object.entries(porPag).map(([k,v])=>`<div class="mrow"><span class="ml">${k}</span><div style="display:flex;gap:6px;align-items:center"><span class="mv">${BRL(v)}</span>${bdg("bgr",PCT((v/(fat||1))*100))}</div></div>`).join(""):`<div style="font-size:12px;color:var(--txt3)">Sem vendas ainda.</div>`}
    </div>
  </div>`;
}

// ── CONTAS A PAGAR ──
function diasParaVencer(venc){
  if(!venc)return 999;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const p=venc.split("/");
  const d=new Date(+p[2],+p[1]-1,+p[0]);
  return Math.round((d-hoje)/(1000*60*60*24));
}
function verificarLembretes(){
  if(!DB.contas)return;
  const prox=DB.contas.filter(c=>!c.paga&&diasParaVencer(c.vencimento)<=3&&diasParaVencer(c.vencimento)>=0);
  if(prox.length>0)console.log("Contas vencendo:",prox.map(c=>c.nome).join(", "));
}
function rContas(el){
  if(!DB.contas)DB.contas=[];
  const pendentes=DB.contas.filter(c=>!c.paga).sort((a,b)=>diasParaVencer(a.vencimento)-diasParaVencer(b.vencimento));
  const pagas=DB.contas.filter(c=>c.paga);
  const totalPend=pendentes.reduce((a,c)=>a+c.valor,0);
  el.innerHTML=`
  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="kl">Pendentes</div><div class="kv" style="color:var(--warn-txt)">${pendentes.length}</div></div>
    <div class="kpi"><div class="kl">Total a pagar</div><div class="kv" style="font-size:14px;color:var(--red-txt)">${BRL(totalPend)}</div></div>
    <div class="kpi"><div class="kl">Pagas no mês</div><div class="kv" style="color:var(--green-txt)">${pagas.length}</div></div>
  </div>
  <div class="card">
    <div class="chd"><div class="ct">Contas a pagar</div><button class="btn btn-p btn-sm" onclick="abrirMConta(null)">+ Nova conta</button></div>
    ${pendentes.length===0?`<div style="font-size:12px;color:var(--green-txt);padding:8px 0">✓ Nenhuma conta pendente</div>`:""}
    ${pendentes.map(c=>{
      const dias=diasParaVencer(c.vencimento);
      const cor=dias<0?"red":dias<=3?"warn":"green";
      const label=dias<0?`Vencida há ${Math.abs(dias)} dias`:dias===0?"Vence hoje":`${dias} dias`;
      return `<div class="conta-card">
        <div class="conta-info">
          <div class="conta-nome">${c.nome}</div>
          <div class="conta-meta">${c.categoria||"Geral"} · Vence: ${c.vencimento} · ${BRL(c.valor)}</div>
          ${c.obs?`<div style="font-size:11px;color:var(--txt3);margin-top:2px">${c.obs}</div>`:""}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
          <span class="lembrete-badge" style="background:var(--${cor}-bg);color:var(--${cor}-txt)">${label}</span>
          <div style="display:flex;gap:4px">
            <button class="btn btn-s btn-sm" onclick="pagarConta(${c.id})">✓ Pagar</button>
            <button class="btn btn-sm" onclick="abrirMConta(${c.id})">✏</button>
            <button class="btn btn-d btn-sm" onclick="delConta(${c.id})">🗑</button>
          </div>
        </div>
      </div>`;
    }).join("")}
    ${pagas.length?`<div style="font-size:12px;font-weight:500;color:var(--txt3);margin:10px 0 6px">Pagas (${pagas.length})</div>
    ${pagas.slice(0,5).map(c=>`<div class="conta-card" style="opacity:.6">
      <div class="conta-info"><div class="conta-nome">${c.nome}</div><div class="conta-meta">${c.vencimento} · ${BRL(c.valor)}</div></div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        ${bdg("bg","✓ Paga")}
        <button class="btn btn-d btn-sm" onclick="delConta(${c.id})">🗑</button>
      </div>
    </div>`).join("")}`:""}
  </div>`;
}
function abrirMConta(id){
  mD=id?{...DB.contas.find(c=>c.id===id)}:{nome:"",valor:"",vencimento:"",categoria:"",obs:"",id:null};
  document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box">
    <div class="mtitle">${id?"Editar conta":"Nova conta"}<button class="btn btn-sm" onclick="fecharModal()">✕</button></div>
    <div class="field"><label>Nome / descrição *</label><input class="fi" id="cn-nome" value="${mD.nome||""}" placeholder="Ex: Boleto fornecedor Medline" oninput="mD.nome=this.value"></div>
    <div class="f2">
      <div class="field"><label>Valor (R$) *</label><input class="fi" type="number" step="0.01" id="cn-valor" value="${mD.valor||""}" placeholder="0.00" oninput="mD.valor=this.value"></div>
      <div class="field"><label>Vencimento *</label><input class="fi" type="date" id="cn-venc" value="${dataParaInput(mD.vencimento)}" onchange="mD.vencimento=inputParaData(this.value)"></div>
      <div class="field fc"><label>Categoria</label>
        <select class="fi" id="cn-cat" onchange="mD.categoria=this.value">
          ${["Fornecedor","Aluguel","Salário","Marketing","Energia","Internet","Imposto","Outro"].map(c=>`<option${c===(mD.categoria||"Fornecedor")?" selected":""}>${c}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field"><label>Observação / lembrete</label><input class="fi" id="cn-obs" value="${mD.obs||""}" placeholder="Ex: Boleto código 12345" oninput="mD.obs=this.value"></div>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-p" onclick="salvarConta()">✓ Salvar</button>
    </div>
  </div></div>`;
  document.getElementById("modal-wrap").style.display="block";
}
async function salvarConta(){
  const nome=document.getElementById("cn-nome")?.value.trim();
  const valor=parseFloat(document.getElementById("cn-valor")?.value)||0;
  const venc=inputParaData(document.getElementById("cn-venc")?.value);
  const cat=document.getElementById("cn-cat")?.value;
  const obs=document.getElementById("cn-obs")?.value.trim();
  if(!nome||!valor||!venc){alert("Nome, valor e vencimento são obrigatórios.");return;}
  if(!DB.contas)DB.contas=[];
  const c={...mD,nome,valor,vencimento:venc,categoria:cat,obs,paga:mD.paga||false};
  if(c.id)DB.contas=DB.contas.map(x=>x.id===c.id?c:x);
  else{c.id=DB.nextContaId++;DB.contas.push(c);}
  fecharModal();await salvar();rerender();
}
async function pagarConta(id){
  DB.contas=DB.contas.map(c=>c.id===id?{...c,paga:true}:c);
  await salvar();rerender();
}
async function delConta(id){
  if(!confirm("Remover conta?"))return;
  DB.contas=DB.contas.filter(c=>c.id!==id);
  await salvar();rerender();
}

// ── VENDAS ──
function rVendas(el){
  const vendas=[...DB.vendas].reverse();
  const busca=el._busca||"";
  el._busca=busca;
  const lista=vendas.filter(v=>
    v.cliente.toLowerCase().includes(busca.toLowerCase())||
    v.produto.toLowerCase().includes(busca.toLowerCase())||
    v.vendedor.toLowerCase().includes(busca.toLowerCase())
  );
  const fat=DB.vendas.reduce((a,v)=>a+v.valor,0);
  const luc=DB.vendas.reduce((a,v)=>a+v.lucro,0);
  el.innerHTML=`
  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="kl">Total vendas</div><div class="kv">${DB.vendas.length}</div></div>
    <div class="kpi"><div class="kl">Faturamento total</div><div class="kv" style="font-size:14px">${BRL(fat)}</div></div>
    <div class="kpi"><div class="kl">Lucro total</div><div class="kv" style="font-size:14px;color:var(--green-txt)">${BRL(luc)}</div></div>
  </div>
  <div class="card">
    <div class="chd"><div class="ct">Histórico</div><span style="font-size:11px;color:var(--txt3)">${lista.length} registro(s)</span></div>
    <input class="fi" style="margin-bottom:10px" placeholder="Buscar por cliente, produto ou vendedor..." value="${busca}"
      oninput="document.getElementById('sec-vendas')._busca=this.value;rVendas(document.getElementById('sec-vendas'))">
    ${lista.length===0?`<div style="text-align:center;padding:20px;font-size:13px;color:var(--txt3)">Nenhuma venda encontrada.</div>`:
    lista.map(v=>`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border);gap:10px">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:500;color:var(--txt)">${v.cliente}</span>
          ${bdg(v.pagamento==="PIX"?"bi":"bgr",v.pagamento)}
        </div>
        <div style="font-size:12px;color:var(--txt2);margin-bottom:2px">${v.produto} · Qtd: ${v.qtd} · ${v.vendedor}</div>
        <div style="font-size:11px;color:var(--txt3)">${v.data}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
        <div style="text-align:right">
          <div style="font-size:14px;font-weight:500">${BRL(v.valor)}</div>
          <div style="font-size:11px;color:var(--green-txt)">lucro ${BRL(v.lucro)}</div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-w btn-sm" onclick="editarVenda(${v.id})">✏ Editar</button>
          <button class="btn btn-d btn-sm" onclick="delVenda(${v.id})">🗑</button>
        </div>
      </div>
    </div>`).join("")}
  </div>`;
}
function editarVenda(id){
  const v=DB.vendas.find(x=>x.id===id);
  if(!v)return;
  editVendaId=id;
  pCli=v.cliente;pId=v.produtoId;pBusca=v.produto;
  pQtd=String(v.qtd);pDesc="0";pPag=v.pagamento;pVend=v.vendedor;pData=v.data;pFiltrados=[];
  goTab("pdv",document.querySelector('.tab[onclick*="pdv"]'));
}
async function delVenda(id){
  if(!confirm("Excluir esta venda? O estoque será restaurado."))return;
  const v=DB.vendas.find(x=>x.id===id);
  if(v)DB.produtos=DB.produtos.map(p=>p.id===v.produtoId?{...p,estoque:p.estoque+v.qtd}:p);
  DB.vendas=DB.vendas.filter(x=>x.id!==id);
  await salvar();rerender();
}

// ── METAS ──
function rMetas(el){
  const{vendas,metas}=DB;
  const fat=vendas.reduce((a,v)=>a+v.valor,0);
  const luc=vendas.reduce((a,v)=>a+v.lucro,0);
  const tk=vendas.length?fat/vendas.length:0;
  const cli=new Set(vendas.map(v=>v.cliente)).size;
  const itens=[{k:"faturamento",l:"Faturamento mensal",real:fat,c:"#378ADD"},{k:"lucro",l:"Lucro líquido",real:luc,c:"#639922"},{k:"ticket",l:"Ticket médio",real:tk,c:"#EF9F27"},{k:"clientes",l:"Clientes únicos",real:cli,c:"#D4537E"}];
  el.innerHTML=`
  <div class="card">
    <div class="chd"><div class="ct">Metas do mês</div><button class="btn btn-sm" onclick="abrirMMetas()">✏ Editar</button></div>
    ${itens.map(it=>{
      const pct=metas[it.k]>0?(it.real/metas[it.k])*100:0;const ok=pct>=100;
      return `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:500">${it.l}</span><span style="font-size:11px;color:var(--txt2)">${it.k==="clientes"?`${Math.round(it.real)} / ${metas[it.k]}`:`${BRL(it.real)} / ${BRL(metas[it.k])}`}</span></div>
        <div class="prog"><div class="pf" style="width:${Math.min(100,Math.round(pct))}%;background:${ok?"#639922":it.c}"></div></div>
        <div style="font-size:10px;color:${ok?"var(--green-txt)":"var(--txt3)"};margin-top:2px">${ok?"Meta atingida ✓":Math.round(pct)+"% concluído"}</div>
      </div>`;
    }).join("")}
  </div>`;
}
function abrirMMetas(){
  const{metas}=DB;
  document.getElementById("modal-wrap").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal-box">
    <div class="mtitle">Editar metas<button class="btn btn-sm" onclick="fecharModal()">✕</button></div>
    ${[["faturamento","Faturamento mensal (R$)"],["lucro","Lucro líquido (R$)"],["ticket","Ticket médio (R$)"],["clientes","Clientes únicos"]].map(([k,l])=>`<div class="field"><label>${l}</label><input class="fi" type="number" id="mt${k}" value="${metas[k]}"></div>`).join("")}
    <button class="btn btn-p btn-full" onclick="salvarMetas()">✓ Salvar metas</button>
  </div></div>`;
  document.getElementById("modal-wrap").style.display="block";
}
async function salvarMetas(){
  DB.metas={faturamento:+document.getElementById("mtfaturamento").value||0,lucro:+document.getElementById("mtlucro").value||0,ticket:+document.getElementById("mtticket").value||0,clientes:+document.getElementById("mtclientes").value||0};
  fecharModal();await salvar();rerender();
}

carregar();
</script>
</body>
</html>
